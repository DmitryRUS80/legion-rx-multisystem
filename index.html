<script>'use strict';

const SCORE_TABLE = [50,45,42,40,39,38,37,36,35,34,33,32,31,30,29,28];
const EVENT_POINTS = [25,18,15,12,10,8,6,4,2,1];
const FINAL_A_RUNS = ['A1','A2','A3'];

function uid(prefix='id'){return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;}
function deepClone(v){return JSON.parse(JSON.stringify(v));}

function makeRace(input={}){
  const now=new Date().toISOString();
  return {
    id:uid('race'),eventName:input.eventName||'Новая гонка',clubName:input.clubName||'Legion RC',eventDate:input.eventDate||new Date().toISOString().slice(0,10),eventLocation:input.eventLocation||'',eventStatus:input.eventStatus||'club',championshipId:input.championshipId||'',championshipStageNumber:input.championshipStageNumber||null,championshipStageId:input.championshipStageId||'',qualifyingCount:Number(input.qualifyingCount||4),publishAllowed:false,
    pilots:[],heats:[],finals:[],finalProtocol:[],exactTieLots:{},stage:'setup',lifecycleStatus:'active',createdAt:now,updatedAt:now,completedAt:'',
    raceSettings:{
      qualificationLimitType:input.qualificationLimitType||'time',
      qualificationMinutes:Number(input.qualificationMinutes||5),
      qualificationLaps:Number(input.qualificationLaps||8),
      finalLimitType:input.finalLimitType||'laps',
      finalMinutes:Number(input.finalMinutes||5),
      finalLaps:Number(input.finalLaps||7),
      countdownSec:Number(input.countdownSec||5),
      minLapSec:Number(input.minLapSec||2)
    },
    runtime:{activeEventKey:'',session:null,eventResults:{},eventLog:[]}
  };
}

function makePilot(profile={},registrationOrder=1){
  return {id:profile.id||uid('pilot'),profileId:profile.profileId||profile.id||'',name:profile.name||'Пилот',club:profile.club||'',city:profile.city||'',photo:profile.photo||'',transponder:String(profile.transponder||''),registrationOrder,qualifying:[],best3:0,points:0,best3Rounds:[],finalResults:[]};
}
function getPilot(race,id){return race.pilots.find(p=>String(p.id)===String(id));}

function getPoints(place){if(!Number.isInteger(place)||place<1)return 0;return SCORE_TABLE[place-1]??Math.max(1,29-place);}
function qualifyingResultRank(result){if(!result)return 10000;if(result.status==='FIN')return result.place;if(result.status==='DNF')return 100+(result.dnfOrder||99);if(result.status==='DNS')return 300;if(result.status==='DSQ')return 400;return 500;}
function savePilotResult(pilot,round,heat,resultValue,dnfOrder=null){
  const existing=pilot.qualifying.find(r=>r.round===round);const isPlace=Number.isInteger(resultValue);const record={round,heat,place:isPlace?resultValue:null,status:isPlace?'FIN':resultValue,dnfOrder:resultValue==='DNF'&&Number.isInteger(dnfOrder)?dnfOrder:null,points:isPlace?getPoints(resultValue):0};
  if(existing)Object.assign(existing,record);else pilot.qualifying.push(record);
}
function getBest3Results(pilot){return [...pilot.qualifying].sort((a,b)=>{if(b.points!==a.points)return b.points-a.points;const rd=qualifyingResultRank(a)-qualifyingResultRank(b);if(rd!==0)return rd;return b.round-a.round;}).slice(0,3);}
function getDiscardedResults(pilot){const sel=new Set(getBest3Results(pilot).map(i=>`${i.round}:${i.heat}`));return pilot.qualifying.filter(i=>!sel.has(`${i.round}:${i.heat}`)).sort((a,b)=>{if(b.points!==a.points)return b.points-a.points;const rd=qualifyingResultRank(a)-qualifyingResultRank(b);if(rd!==0)return rd;return b.round-a.round;});}

function fmtClock(ms){if(!Number.isFinite(ms))return'00:00';const t=Math.ceil(Math.max(0,ms)/1000),m=Math.floor(t/60),s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}

function pilotTable(pilots,session){return `<div class="pilotRow header"><span>POS</span><span>ПИЛОТ</span><span>КРУГИ</span><span>ЛУЧШИЙ КРУГ</span><span>ПОСЛЕДНИЙ</span><span>ОТСТАВАНИЕ</span><span>СТАТУС</span></div>${pilots.map((p,i)=>{const l=session?.live?.[p.id]||blankLive();const gap=gapText(pilots,session,p,i),status=l.finished?'Финиш':i===0&&l.laps>0?'Лидер':session?.phase==='paused'?'Пауза':session?.phase==='running'||session?.phase==='finishing'?'В гонке':'Готов';return `<div class="pilotRow ${i===0&&l.laps>0?'leader':''} ${l.finished?'finished':''}" data-pilot-row="${p.id}"><div class="pos">${i+1}</div><div class="pilotNameCell"><div class="name">${esc(p.name)}</div><div class="sub">ID ${esc(p.transponder||'—')}</div></div><b>${l.laps}</b><strong class="bestLap">${fmtMs(l.bestLapMs)}</strong><span>${fmtMs(l.lastLapMs)}</span><span>${gap}</span><span class="pilotStatus ${i===0&&l.laps>0?'leaderStatus':''}"><i></i>${status}</span></div>`;}).join('')}`;}

function ensureSession(ev){if(!ev)return null;if(state.session?.eventKey!==ev.key){state.session={eventKey:ev.key,phase:'ready',startedAtPerf:null,runStartedAtPerf:null,accumulatedElapsedMs:0,startedAtEpoch:null,finishedAtEpoch:null,countdownLeft:state.race.raceSettings.countdownSec,extraMinutes:0,live:Object.fromEntries(getEventPilots(state.race,ev).map(p=>[p.id,blankLive()])),unknown:{},lastPass:'',phaseBeforePause:'running'};}return state.session;}

async function beginRaceNow(){const ev=currentEvent(state.race),s=ensureSession(ev),rule=eventRule(state.race,ev);try{if(lapwiz.connected)await lapwiz.start(rule);}catch(e){toast(`LapWiz START: ${e.message}`);return;}s.phase='running';s.startedAtPerf=performance.now();s.runStartedAtPerf=s.startedAtPerf;s.accumulatedElapsedMs=0;s.startedAtEpoch=Date.now();s.finishedAtEpoch=null;s.timeExpired=false;s.extraMinutes=0;Object.values(s.live).forEach(v=>Object.assign(v,blankLive()));logEvent(`Старт: ${ev.label}`);startTicker();render();}

function checkSessionLimit(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||s.phase!=='running')return;const r=eventRule(state.race,ev),elapsed=sessionElapsed(s),limit=(r.durationMin+(s.extraMinutes||0))*60000;if(r.limitType==='time'&&elapsed>=limit&&!s.timeExpired){s.timeExpired=true;s.phase='finishing';Object.values(s.live).forEach(v=>{if(!v.finished)v.needsFinish=true;});toast('Время истекло — финиш на следующем проходе');}if(r.limitType==='laps'){const all=Object.values(s.live).every(v=>v.finished);if(all)finishSession('Все пилоты финишировали');}}
function processPass(transponder,deviceMs=null,source='MANUAL'){lapwiz.lastId=String(transponder);const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return;const p=getEventPilots(state.race,ev).find(x=>String(x.transponder)===String(transponder));if(!p){s.unknown[transponder]=(s.unknown[transponder]||0)+1;if(source==='LAPWIZ')lapwiz.unknownBeep();toast(`Неизвестный ID ${transponder}`);return;}if(source==='LAPWIZ'&&state.settings.lapSound)lapwiz.beep(true);processPilotPass(p,deviceMs,source);}
function processPilotPass(p,deviceMs=null,source='MANUAL'){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return;const l=s.live[p.id]||blankLive();if(l.finished)return;const now=performance.now(),elapsedNow=sessionElapsed(s);let lapMs=null;if(Number.isFinite(deviceMs)&&source==='LAPWIZ'){if(Number.isFinite(l.lastDeviceMs)&&deviceMs>l.lastDeviceMs)lapMs=deviceMs-l.lastDeviceMs;else if(!l.lastDeviceMs&&deviceMs>0)lapMs=deviceMs;l.lastDeviceMs=deviceMs;}if(!Number.isFinite(lapMs)||lapMs<=0)lapMs=elapsedNow-(Number.isFinite(l.lastElapsedAtPass)?l.lastElapsedAtPass:0);l.lastElapsedAtPass=elapsedNow;l.lastPassPerf=now;l.lastLapMs=lapMs;l.bestLapMs=Math.min(l.bestLapMs,lapMs);l.laps++;l.elapsedMs=elapsedNow;const rule=eventRule(state.race,ev);if(rule.limitType==='laps'&&l.laps>=rule.targetLaps){l.finished=true;l.finishedAt=l.elapsedMs;}if(s.phase==='finishing'&&s.timeExpired){l.finished=true;l.finishedAt=l.elapsedMs;}s.live[p.id]=l;s.lastPass=`${p.name} · ${l.laps} · ${fmtMs(lapMs)}`;if(source==='MANUAL'&&state.settings.lapSound)lapwiz.beep(true);updateDynamicCockpit();if(Object.values(s.live).every(v=>v.finished)&&(rule.limitType==='laps'||s.phase==='finishing'))finishSession('Все пилоты завершили заезд');}
function logEvent(text){state.race.runtime.eventLog.push({time:new Date().toISOString(),text});persistRace();}
function makeDraftResult(pilots,session){return pilots.map((p,i)=>{const l=session?.live?.[p.id]||blankLive();return{pilotId:p.id,name:p.name,status:'FIN',place:i+1,laps:l.laps,elapsedMs:l.elapsedMs};});}
function readEditedResult(){const ev=currentEvent(state.race),ranked=liveRanking(getEventPilots(state.race,ev),state.session);return ranked.map((p,i)=>{const st=document.querySelector(`[data-result-status="${CSS.escape(String(p.id))}"]`)?.value||'FIN',place=Number(document.querySelector(`[data-result-place="${CSS.escape(String(p.id))}"]`)?.value||i+1);return{pilotId:p.id,status:st,place:st==='FIN'?place:null,dnfOrder:st==='DNF'?i+1:null};});}
function saveCurrentEventResult(){const race=state.race,ev=currentEvent(race),s=state.session;if(!ev||s?.phase!=='finished')return toast('Сначала завершите заезд');try{const result=readEditedResult();if(ev.type==='qualifying')saveQualifyingEvent(race,ev.key,result);else saveFinalEvent(race,ev.key,result);syncChampionshipIfFinished(race);persistRace();state.session=null;state.resultsOpen=false;toast('Результат сохранён. Следующий заезд подготовлен.');render();}catch(e){toast(e.message);}}

async function togglePause(){const s=state.session;if(!s)return;if(lapwiz.connected)return toast('Пауза с LapWiz будет включена после отдельного протокольного теста');if(s.phase==='running'){s.accumulatedElapsedMs=sessionElapsed(s);s.runStartedAtPerf=null;s.phaseBeforePause='running';s.phase='paused';logEvent('Пауза');render();return;}if(s.phase==='paused'){s.runStartedAtPerf=performance.now();s.phase=s.phaseBeforePause||'running';logEvent('Продолжение заезда');render();}}
function addMinute(){const s=state.session,ev=currentEvent(state.race);if(!s||!ev)return;if(lapwiz.connected)return toast('+1 мин с LapWiz подключим после отдельного теста');const r=eventRule(state.race,ev);if(r.limitType!=='time')return toast('+1 мин доступна только для заезда по времени');s.extraMinutes=(s.extraMinutes||0)+1;s.timeExpired=false;if(s.phase==='finishing')s.phase='running';logEvent('Добавлена 1 минута');toast('Добавлена 1 минута');render();}
function manualPassPicker(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return toast('Сначала запустите заезд');const pilots=liveRanking(getEventPilots(state.race,ev),s);$('#modalHost').innerHTML=`<div class="modalBackdrop"><div class="modal manualPassModal"><div class="modalHead"><div><div class="sectionLabel">РУЧНОЙ РЕЗЕРВ</div><h2>Кому засчитать круг?</h2></div><button class="iconBtn" id="closeModal">×</button></div><div class="manualPilotGrid">${pilots.map(p=>{const l=s.live[p.id]||blankLive();return `<button class="manualPilotBtn" data-manual-picker="${p.id}" ${l.finished?'disabled':''}><span>${esc(p.name)}</span><b>${l.laps} кр.</b></button>`;}).join('')}</div></div></div>`;$('#closeModal').onclick=closeModal;$$('[data-manual-picker]').forEach(b=>b.onclick=()=>{const p=getPilot(state.race,b.dataset.manualPicker);if(p){processPilotPass(p,null,'MANUAL');closeModal();}});}
function quickNextEvent(){const race=state.race,ev=currentEvent(race),s=state.session;if(!ev||s?.phase!=='finished')return toast('Сначала завершите текущий заезд');if(!confirm('Сохранить текущий порядок финиша и перейти к следующему заезду? Для DNF/DNS/DSQ используйте виджет «Результаты заезда».'))return;try{const ranked=liveRanking(getEventPilots(race,ev),s),result=ranked.map((p,i)=>({pilotId:p.id,status:'FIN',place:i+1,dnfOrder:null}));if(ev.type==='qualifying')saveQualifyingEvent(race,ev.key,result);else saveFinalEvent(race,ev.key,result);syncChampionshipIfFinished(race);persistRace();state.session=null;state.resultsOpen=false;state.widgetCollapsed.results=true;toast('Результат сохранён. Следующий заезд готов.');render();}catch(e){toast(e.message);}}

function normalizeChampionship(c){

}

function champCard(c){normalizeChampionship(c);const standings=champStandings(c),active=c.stagePlans.filter(s=>s.status==='active').length;return `<article class="card championshipCard"><div class="sectionLabel">${esc(c.season)}</div><div class="champTitleRow"><div><h2>${esc(c.name)}</h2><p>${c.stagePlans.length} запланировано · ${c.stages.length} завершено${active?` · ${active} активно`:''}</p></div><button class="btn primary" data-open-champ="${c.id}">Войти в чемпионат ${uiIcon('chevron','btnIcon')}</button></div>${standings.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Место</th><th>Пилот</th><th>Очки</th></tr></thead><tbody>${standings.slice(0,5).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td><b>${r.total}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Нет завершённых этапов.</div>`}</article>`;}
function champStandings(c){const m=new Map();(c.stages||[]).forEach(s=>(s.results||[]).forEach(r=>{const row=m.get(r.driverId)||{driverId:r.driverId,name:r.name,total:0,stages:0};row.total+=Number(r.points||0);row.stages++;m.set(r.driverId,row);}));return[...m.values()].sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));}

function eventRuleText405(race,ev){if(!ev)return'Нет активного заезда';const r=eventRule(race,ev);return r.limitType==='time'?`${r.durationMin} мин · финиш текущего круга`:`${r.targetLaps} кругов`;}

function timerTotalMs(ev,s){const r=eventRule(state.race,ev);return r?.limitType==='time'?r.durationMin*60000+(s?.extraMs||0):null;}
function timerProgress(ev,s){if(!ev||!s)return 0;const r=eventRule(state.race,ev);if(r.limitType==='time'){const total=timerTotalMs(ev,s)||1;return Math.max(0,Math.min(100,((total-sessionElapsed(s))/total)*100));}const ranked=liveRanking(getEventPilots(state.race,ev),s),lead=ranked[0]&&s.live?.[ranked[0].id];return Math.max(0,Math.min(100,((lead?.laps||0)/(r.targetLaps||1))*100));}

 if(done)return `<button class="consoleControl" data-action="home">${raceSvg('home')}<span>ГЛАВНАЯ</span></button><button class="consoleControl" data-action="open-rx">${raceSvg('settings')}<span>НАСТРОЙКА</span></button><button class="consoleControl primary" data-action="race-results">${raceSvg('chart')}<span>РЕЗУЛЬТАТЫ</span></button><button class="consoleControl" disabled>${raceSvg('mic')}<span>ДИКТОР</span></button><button class="consoleControl" disabled>${raceSvg('radio')}<span>BROADCAST</span></button><button class="consoleControl danger" data-action="complete-competition">${raceSvg('stop')}<span>ЗАВЕРШИТЬ</span></button>`;
 const p=s?.phase||'ready',timeRule=eventRule(state.race,currentEvent(state.race))?.limitType==='time';const primary=p==='ready'?`<button class="consoleControl primary" data-action="start-session">${raceSvg('play')}<span>СТАРТ</span></button>`:p==='finished'?`<button class="consoleControl primary" data-action="next-event">${raceSvg('next')}<span>СЛЕДУЮЩИЙ</span></button>`:`<button class="consoleControl primary" disabled>${raceSvg('next')}<span>СЛЕДУЮЩИЙ</span></button>`;
 return `<button class="consoleControl" data-action="pause-session" ${!['running','finishing','paused'].includes(p)?'disabled':''}>${raceSvg(p==='paused'?'play':'pause')}<span>${p==='paused'?'ПРОДОЛЖИТЬ':'ПАУЗА'}</span></button><button class="consoleControl" data-action="finish-session" ${!['running','finishing','paused'].includes(p)?'disabled':''}>${raceSvg('flag')}<span>ФИНИШ</span></button><button class="consoleControl" data-action="add-minute" ${!timeRule||!['running','paused','finishing'].includes(p)?'disabled':''}>${raceSvg('plusClock')}<span>+1 МИН</span></button>${primary}<button class="consoleControl primarySoft" data-action="manual-lap-modal" ${!['running','finishing'].includes(p)?'disabled':''}>${raceSvg('refresh')}<span>РУЧНОЙ КРУГ</span></button><button class="consoleControl danger" data-action="stop-session" ${!['running','finishing','countdown','paused'].includes(p)?'disabled':''}>${raceSvg('stop')}<span>СТОП</span></button>`;
}
function ensureSession(ev){if(!ev)return null;if(state.session?.eventKey!==ev.key){state.session={eventKey:ev.key,phase:'ready',startedAtPerf:null,startedAtEpoch:null,finishedAtEpoch:null,elapsedBeforePause:0,elapsedFinalMs:null,extraMs:0,resumePhase:'running',countdownLeft:state.race.raceSettings.countdownSec,live:Object.fromEntries(getEventPilots(state.race,ev).map(p=>[p.id,blankLive()])),unknown:{},lastPass:''};}return state.session;}
function sessionElapsed(s){if(!s)return 0;if(Number.isFinite(s.elapsedFinalMs))return s.elapsedFinalMs;const base=Number(s.elapsedBeforePause)||0;if(s.phase==='paused'||!s.startedAtPerf)return base;return base+(performance.now()-s.startedAtPerf);}
function updateDynamicCockpit(){const ev=currentEvent(state.race),s=state.session,timer=$('#mainTimer');if(timer)timer.textContent=displayTimer(s,ev);const ring=$('#timerRing');if(ring)ring.style.setProperty('--progress',timerProgress(ev,s));const clock=$('#cockpitClock');if(clock)clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour12:false});const board=$('.pilotBoardTable');if(board&&ev&&s&&s.phase!=='finished'){const ranked=liveRanking(getEventPilots(state.race,ev),s),sig=ranked.map(p=>{const l=s.live[p.id]||blankLive();return `${p.id}:${l.laps}:${Math.round(l.lastLapMs||0)}:${l.finished}`}).join('|');if(sig!==state.lastBoardSignature){state.lastBoardSignature=sig;const update=()=>{board.innerHTML=pilotTable(ranked,s);};if(document.startViewTransition)document.startViewTransition(update);else update();}}const best=$('#bestHeatLap');if(best&&ev)best.textContent=bestHeatLapText(liveRanking(getEventPilots(state.race,ev),s),s);const lp=$('#lastPassLine');if(lp)lp.textContent=s?.lastPass||'—';const stats=$$('.statsWidgetContent');if(stats.length&&ev&&s){const ranked=liveRanking(getEventPilots(state.race,ev),s),leader=ranked[0],ll=leader?s.live?.[leader.id]:null,target=eventRule(state.race,ev).targetLaps||'—';const html=`<div><span>ЛИДЕР</span><b>${esc(leader?.name||'—')}</b></div><div><span>КРУГИ ЛИДЕРА</span><b>${ll?.laps||0}${target!=='—'?` / ${target}`:''}</b></div><div><span>ПОСЛЕДНИЙ ПРОХОД</span><b>${esc(s.lastPass||'—')}</b></div><div><span>ПИЛОТОВ</span><b>${ranked.length}</b></div>`;stats.forEach(el=>el.innerHTML=html);}}
async function beginRaceNow(){const ev=currentEvent(state.race),s=ensureSession(ev),rule=eventRule(state.race,ev);try{if(lapwiz.connected)await lapwiz.start(rule);}catch(e){toast(`LapWiz START: ${e.message}`);return;}s.phase='running';s.startedAtPerf=performance.now();s.startedAtEpoch=Date.now();s.finishedAtEpoch=null;s.elapsedBeforePause=0;s.elapsedFinalMs=null;s.extraMs=s.extraMs||0;s.timeExpired=false;Object.values(s.live).forEach(v=>Object.assign(v,blankLive()));logEvent(`Старт: ${ev.label}`);startTicker();render();}
async function pauseSession(){const s=state.session;if(!s)return;if(s.phase==='paused')return resumeSession();if(!['running','finishing'].includes(s.phase))return;s.elapsedBeforePause=sessionElapsed(s);s.startedAtPerf=null;s.resumePhase=s.phase;s.phase='paused';Object.values(s.live).forEach(v=>{v.lastPassPerf=null;v.lastDeviceMs=null;});if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();}catch(e){toast(`LapWiz STOP: ${e.message}`);}}logEvent('Пауза');render();}
async function resumeSession(){const ev=currentEvent(state.race),s=state.session;if(!ev||s?.phase!=='paused')return;const rule=eventRule(state.race,ev);if(lapwiz.connected){try{const rr={...rule};if(rr.limitType==='time')rr.durationMin=Math.max(1/60,(timerTotalMs(ev,s)-sessionElapsed(s))/60000);await lapwiz.start(rr);}catch(e){toast(`LapWiz RESUME: ${e.message}`);return;}}s.phase=s.resumePhase||'running';s.startedAtPerf=performance.now();Object.values(s.live).forEach(v=>{v.lastPassPerf=null;v.lastDeviceMs=null;});logEvent('Продолжение после паузы');startTicker();render();}
async function addMinute(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s)return;const rule=eventRule(state.race,ev);if(rule.limitType!=='time')return toast('+1 мин доступна только для заезда по времени');s.extraMs=(s.extraMs||0)+60000;if(s.phase==='finishing'&&sessionElapsed(s)<timerTotalMs(ev,s)){s.phase='running';s.timeExpired=false;Object.values(s.live).forEach(v=>v.needsFinish=false);}if(s.phase==='paused'&&s.resumePhase==='finishing'&&sessionElapsed(s)<timerTotalMs(ev,s)){s.resumePhase='running';s.timeExpired=false;Object.values(s.live).forEach(v=>v.needsFinish=false);}logEvent('Добавлена 1 минута');if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();const remaining=Math.max(1000,timerTotalMs(ev,s)-sessionElapsed(s));await lapwiz.start({...rule,durationMin:remaining/60000});Object.values(s.live).forEach(v=>{v.lastDeviceMs=null;});}catch(e){toast(`LapWiz +1 мин: ${e.message}`);}}toast('К заезду добавлена 1 минута');updateDynamicCockpit();}
async function finishSession(reason='Финиш судьёй'){const s=state.session;if(!s)return;const elapsed=sessionElapsed(s);if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();}catch(e){toast(`STOP: ${e.message}`);}}s.elapsedFinalMs=elapsed;s.phase='finished';s.finishedAtEpoch=Date.now();logEvent(reason);state.resultsOpen=true;state.widgetCollapsed.results=false;render();}
function checkSessionLimit(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||s.phase!=='running')return;const r=eventRule(state.race,ev),elapsed=sessionElapsed(s);if(r.limitType==='time'&&elapsed>=r.durationMin*60000+(s.extraMs||0)&&!s.timeExpired){s.timeExpired=true;s.phase='finishing';Object.values(s.live).forEach(v=>{if(!v.finished)v.needsFinish=true;});toast('Время истекло — финиш на следующем проходе');}if(r.limitType==='laps'){const all=Object.values(s.live).every(v=>v.finished);if(all)finishSession('Все пилоты финишировали');}}
function processPilotPass(p,deviceMs=null,source='MANUAL'){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return;const l=s.live[p.id]||blankLive();if(l.finished)return;const now=performance.now();let lapMs=null;if(Number.isFinite(deviceMs)){if(Number.isFinite(l.lastDeviceMs)&&deviceMs>l.lastDeviceMs)lapMs=deviceMs-l.lastDeviceMs;else if(Number.isFinite(l.lastPassPerf))lapMs=now-l.lastPassPerf;else if(deviceMs>0)lapMs=deviceMs;l.lastDeviceMs=deviceMs;}if(!Number.isFinite(lapMs)||lapMs<=0)lapMs=now-(l.lastPassPerf??s.startedAtPerf??now);l.lastPassPerf=now;l.lastLapMs=lapMs;l.bestLapMs=Math.min(l.bestLapMs,lapMs);l.laps++;l.elapsedMs=sessionElapsed(s);const rule=eventRule(state.race,ev);if(rule.limitType==='laps'&&l.laps>=rule.targetLaps){l.finished=true;l.finishedAt=l.elapsedMs;}if(s.phase==='finishing'&&s.timeExpired){l.finished=true;l.finishedAt=l.elapsedMs;}s.live[p.id]=l;s.lastPass=`${p.name} · ${l.laps} · ${fmtMs(lapMs)}`;if(source==='MANUAL'&&state.settings.lapSound)lapwiz.beep(true);updateDynamicCockpit();if(Object.values(s.live).every(v=>v.finished)&&(rule.limitType==='laps'||s.phase==='finishing'))finishSession('Все пилоты завершили заезд');}
function manualLapModal(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return toast('Ручной круг доступен во время заезда');const pilots=liveRanking(getEventPilots(state.race,ev),s);$('#modalHost').innerHTML=`<div class="modalBackdrop"><div class="modal manualLapModal"><div class="modalHead"><div><div class="sectionLabel">РУЧНОЙ РЕЗЕРВ</div><h2>Кому добавить круг?</h2></div><button class="iconBtn" id="closeModal">×</button></div><div class="manualPilotGrid">${pilots.map(p=>{const l=s.live[p.id]||blankLive();return `<button data-manual-modal="${p.id}" ${l.finished?'disabled':''}><span>${nameInitials(p.name)}</span><b>${esc(p.name)}</b><em>${l.laps} кругов</em></button>`;}).join('')}</div></div></div>`;$('#closeModal').onclick=closeModal;$$('[data-manual-modal]').forEach(b=>b.onclick=()=>{const p=getPilot(state.race,b.dataset.manualModal);if(p){processPilotPass(p,null,'MANUAL');toast(`Ручной круг: ${p.name}`);closeModal();}});}
async function handleAction(action,button){if(action==='pause-session')return pauseSession();if(action==='add-minute')return addMinute();if(action==='next-event'){if(state.session?.phase!=='finished')return toast('Сначала завершите текущий заезд');return saveCurrentEventResult();}if(action==='manual-lap-modal')return manualLapModal();if(action==='open-settings')return nav('settings');return legacyHandleAction(action,button);}

lapwiz.addEventListener('pass',e=>processPass(e.detail.transponder,e.detail.deviceMs,'LAPWIZ'));lapwiz.addEventListener('status',()=>updateHeader());
window.addEventListener('pointerdown',()=>lapwiz.ensureAudio(),{once:true});
window.addEventListener('beforeunload',()=>persistAll());

$('#designQuickBtn')?.addEventListener('click',openDesignLab);
if(storedSettings.visualPreset!=='race-console-v1')save(KEYS.settings,state.settings);
applySettings();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>

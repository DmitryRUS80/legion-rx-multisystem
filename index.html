<script>'use strict';

const SCORE_TABLE = [50,45,42,40,39,38,37,36,35,34,33,32,31,30,29,28];
const EVENT_POINTS = [25,18,15,12,10,8,6,4,2,1];
const FINAL_A_RUNS = ['A1','A2','A3'];

function uid(prefix='id'){return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;}
function deepClone(v){return JSON.parse(JSON.stringify(v));}

function makeRace(input={}){
  const now=new Date().toISOString();
  return {
    id:uid('race'),eventName:input.eventName||'Новая гонка',clubName:input.clubName||'Legion RC',eventDate:input.eventDate||new Date().toISOString().slice(0,10),eventLocation:input.eventLocation||'',eventStatus:input.eventStatus||'club',championshipId:input.championshipId||'',championshipStageNumber:input.championshipStageNumber||null,championshipStageId:input.championshipStageId||'',qualifyingCount:Number(input.qualifyingCount||4),publishAllowed:false,
    pilots:[],heats:[],finals:[],finalProtocol:[],exactTieLots:{},stage:'setup',lifecycleStatus:'active',createdAt:now,updatedAt:now,completedAt:'',
    raceSettings:{
      qualificationLimitType:input.qualificationLimitType||'time',
      qualificationMinutes:Number(input.qualificationMinutes||5),
      qualificationLaps:Number(input.qualificationLaps||8),
      finalLimitType:input.finalLimitType||'laps',
      finalMinutes:Number(input.finalMinutes||5),
      finalLaps:Number(input.finalLaps||7),
      countdownSec:Number(input.countdownSec||10),
      warmupMinutes:Math.max(1,Math.min(5,Number(input.warmupMinutes||2))),
      minLapSec:Number(input.minLapSec||2)
    },
    runtime:{activeEventKey:'',session:null,eventResults:{},eventLog:[]}
  };
}

function makePilot(profile={},registrationOrder=1){
  return {id:profile.id||uid('pilot'),profileId:profile.profileId||profile.id||'',name:profile.name||'Пилот',club:profile.club||'',city:profile.city||'',photo:profile.photo||'',transponder:String(profile.transponder||''),registrationOrder,qualifying:[],best3:0,points:0,best3Rounds:[],finalResults:[]};
}
function getPilot(race,id){return race.pilots.find(p=>String(p.id)===String(id));}

function getPoints(place){if(!Number.isInteger(place)||place<1)return 0;return SCORE_TABLE[place-1]??Math.max(1,29-place);}
function qualifyingResultRank(result){if(!result)return 10000;if(result.status==='FIN')return result.place;if(result.status==='DNF')return 100+(result.dnfOrder||99);if(result.status==='DNS')return 300;if(result.status==='DSQ')return 400;return 500;}
function savePilotResult(pilot,round,heat,resultValue,dnfOrder=null){
  const existing=pilot.qualifying.find(r=>r.round===round);const isPlace=Number.isInteger(resultValue);const record={round,heat,place:isPlace?resultValue:null,status:isPlace?'FIN':resultValue,dnfOrder:resultValue==='DNF'&&Number.isInteger(dnfOrder)?dnfOrder:null,points:isPlace?getPoints(resultValue):0};
  if(existing)Object.assign(existing,record);else pilot.qualifying.push(record);
}
function getBest3Results(pilot){return [...pilot.qualifying].sort((a,b)=>{if(b.points!==a.points)return b.points-a.points;const rd=qualifyingResultRank(a)-qualifyingResultRank(b);if(rd!==0)return rd;return b.round-a.round;}).slice(0,3);}
function getDiscardedResults(pilot){const sel=new Set(getBest3Results(pilot).map(i=>`${i.round}:${i.heat}`));return pilot.qualifying.filter(i=>!sel.has(`${i.round}:${i.heat}`)).sort((a,b)=>{if(b.points!==a.points)return b.points-a.points;const rd=qualifyingResultRank(a)-qualifyingResultRank(b);if(rd!==0)return rd;return b.round-a.round;});}
function calculateBest3(pilot){const best=getBest3Results(pilot);pilot.best3=best.reduce((s,r)=>s+r.points,0);pilot.points=pilot.best3;pilot.best3Rounds=best.map(r=>r.round);}
function placeHistogram(results,maxPlace=16){const h=[];for(let p=1;p<=maxPlace;p++)h.push(results.filter(r=>r.status==='FIN'&&r.place===p).length);return h;}
function compareNumberArraysDesc(a,b){const len=Math.max(a.length,b.length);for(let i=0;i<len;i++){const av=a[i]??-Infinity,bv=b[i]??-Infinity;if(bv!==av)return bv-av;}return 0;}
function compareResultArraysByQuality(a,b){const len=Math.max(a.length,b.length);for(let i=0;i<len;i++){const ar=a[i],br=b[i];if(!ar&&!br)continue;if(!ar)return 1;if(!br)return -1;if(br.points!==ar.points)return br.points-ar.points;const rd=qualifyingResultRank(ar)-qualifyingResultRank(br);if(rd!==0)return rd;}return 0;}
function comparePilotsWithoutLot(race,a,b){if(b.best3!==a.best3)return b.best3-a.best3;const bestA=getBest3Results(a),bestB=getBest3Results(b);const hd=compareNumberArraysDesc(placeHistogram(bestA),placeHistogram(bestB));if(hd!==0)return hd;const dd=compareResultArraysByQuality(getDiscardedResults(a),getDiscardedResults(b));if(dd!==0)return dd;for(let round=race.qualifyingCount;round>=1;round--){const rd=qualifyingResultRank(a.qualifying.find(r=>r.round===round))-qualifyingResultRank(b.qualifying.find(r=>r.round===round));if(rd!==0)return rd;}return 0;}
function comparePilots(race,a,b){const s=comparePilotsWithoutLot(race,a,b);if(s!==0)return s;const la=race.exactTieLots?.[String(a.id)],lb=race.exactTieLots?.[String(b.id)];if(Number.isInteger(la)&&Number.isInteger(lb)&&la!==lb)return la-lb;return (a.registrationOrder||9999)-(b.registrationOrder||9999);}
function updateStandings(race){race.pilots.forEach(calculateBest3);race.pilots.sort((a,b)=>comparePilots(race,a,b));return race.pilots;}
function getExactTieGroups(race){updateStandings(race);const groups=[];for(let i=0;i<race.pilots.length;){let g=[race.pilots[i]],j=i+1;while(j<race.pilots.length&&comparePilotsWithoutLot(race,race.pilots[i],race.pilots[j])===0){g.push(race.pilots[j]);j++;}if(g.length>1)groups.push(g);i=j;}return groups;}
function runTieDraw(race){race.exactTieLots=race.exactTieLots||{};getExactTieGroups(race).forEach(group=>{const arr=[...group];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}arr.forEach((p,i)=>race.exactTieLots[String(p.id)]=i+1);});updateStandings(race);}

function getHeatCount(pilotCount){if(pilotCount<=6)return 1;return Math.ceil(pilotCount/6);}
function buildSnakeHeats(pilots,heatCount,round){const shift=pilots.length?(round-1)%pilots.length:0;const ordered=[...pilots.slice(shift),...pilots.slice(0,shift)];const heats=Array.from({length:heatCount},()=>[]);ordered.forEach((pilot,index)=>{const row=Math.floor(index/heatCount),column=index%heatCount,heatIndex=row%2===0?column:heatCount-1-column;heats[heatIndex].push(pilot);});return heats.filter(h=>h.length);}
function createQualifyingData(race){race.heats=[];const pilots=[...race.pilots].sort((a,b)=>(a.registrationOrder||0)-(b.registrationOrder||0));const heatCount=getHeatCount(pilots.length);for(let round=1;round<=race.qualifyingCount;round++){buildSnakeHeats(pilots,heatCount,round).forEach((hp,idx)=>race.heats.push({key:`Q${round}-H${idx+1}`,type:'qualifying',label:`Квалификация ${round} · Заезд ${idx+1}`,round,heat:idx+1,pilots:hp.map(p=>p.id),saved:false,result:[],enabled:round===1&&idx===0,order:round*100+idx}));}}
function prepareRace(race){race.finals=[];race.finalProtocol=[];race.exactTieLots={};race.stage='qualifying';race.pilots.forEach(p=>{p.qualifying=[];p.best3=0;p.points=0;p.finalResults=[];});createQualifyingData(race);normalizeQualifyingEnabled(race);return race;}
function normalizeQualifyingEnabled(race){const unsaved=race.heats.filter(h=>!h.saved).sort((a,b)=>a.order-b.order);race.heats.forEach(h=>h.enabled=false);if(unsaved[0])unsaved[0].enabled=true;}
function saveQualifyingEvent(race,eventKey,result){const heat=race.heats.find(h=>h.key===eventKey);if(!heat||heat.saved)throw new Error('Заезд не найден или уже сохранён');heat.result=normalizeResult(result);heat.saved=true;heat.result.forEach((item,index)=>{const p=getPilot(race,item.pilotId);if(!p)return;if(item.status==='FIN')savePilotResult(p,heat.round,heat.heat,item.place??index+1);else savePilotResult(p,heat.round,heat.heat,item.status,item.dnfOrder);});updateStandings(race);normalizeQualifyingEnabled(race);if(race.heats.every(h=>h.saved)){const ties=getExactTieGroups(race).filter(g=>g.some(p=>!Number.isInteger(race.exactTieLots?.[String(p.id)])));if(ties.length)race.stage='tie';else generateFinals(race);}return heat;}
function resolveQualificationTie(race){runTieDraw(race);generateFinals(race);return race.finals;}

function createFinal(name,pilots=[],options={}){return {key:`F-${name}`,name,label:options.label||name,type:options.type||'lcq',round:Number(options.round||0),order:Number(options.order||0),pilots:pilots.map(p=>p?.id||p),basePilots:pilots.map(p=>p?.id||p),result:[],saved:false,enabled:Boolean(options.enabled),advanceCount:Number(options.advanceCount||0)};}
function finalByName(race,name){return race.finals.find(f=>f.name===name);}
function qualificationRankMap(race){const m=new Map();race.pilots.forEach((p,i)=>m.set(String(p.id),i+1));return m;}
function splitSnake(pilots,groupCount){const groups=Array.from({length:groupCount},()=>[]);if(groupCount<=1)return[pilots.slice()];let index=0,direction=1;pilots.forEach(p=>{groups[index].push(p);if(direction>0){if(index===groupCount-1){direction=-1;index-=1;}else index+=1;}else{if(index===0){direction=1;index+=1;}else index-=1;}});return groups;}
function addFinalARuns(race,pilots,enabledFirst=false,startOrder=1000){FINAL_A_RUNS.forEach((name,index)=>race.finals.push(createFinal(name,pilots,{type:'main',label:`Финал ${name}`,order:startOrder+index,enabled:enabledFirst&&index===0})));}
function createPreliminaryRound(race,pilotIdsOrObjects,round,startOrder){const groupCount=Math.ceil(pilotIdsOrObjects.length/6),groups=splitSnake(pilotIdsOrObjects,groupCount);groups.forEach((group,index)=>race.finals.push(createFinal(`P${round}-${index+1}`,group,{type:'prelim',label:`Предварительный LCQ ${round}.${index+1}`,round,order:startOrder+index,enabled:true,advanceCount:1})));}
function generateFinals(race){updateStandings(race);race.finals=[];race.finalProtocol=[];race.pilots.forEach(p=>p.finalResults=[]);const pilots=[...race.pilots],count=pilots.length;if(count<=6)addFinalARuns(race,pilots,true);else{const remaining=pilots.slice(4);if(count<=10)race.finals.push(createFinal('LCQ',remaining,{type:'single-lcq',label:'Заезд последнего шанса (LCQ)',order:100,enabled:true,advanceCount:2}));else if(count<=16){const groups=splitSnake(remaining,2);race.finals.push(createFinal('LCQ-B',groups[0],{type:'dual-lcq',label:'LCQ B',round:1,order:100,enabled:true,advanceCount:1}));race.finals.push(createFinal('LCQ-C',groups[1],{type:'dual-lcq',label:'LCQ C',round:1,order:101,enabled:true,advanceCount:1}));}else createPreliminaryRound(race,remaining,1,100);addFinalARuns(race,[],false);}race.stage='finals';return race.finals;}
function compareFinalResultItems(a,b){const r={FIN:0,DNF:1,DNS:2,DSQ:3};if(r[a.status]!==r[b.status])return r[a.status]-r[b.status];if(a.status==='FIN')return(a.place||999)-(b.place||999);if(a.status==='DNF')return(a.dnfOrder||999)-(b.dnfOrder||999);return 0;}
function classifiedForAdvancement(result){return result.filter(i=>i.status==='FIN'||i.status==='DNF');}
function setMainGrid(race,lastTwo){const qTop4=race.pilots.slice(0,4).map(p=>p.id),grid=[...qTop4,...lastTwo].slice(0,6);FINAL_A_RUNS.forEach((name,index)=>{const f=finalByName(race,name);if(f){f.pilots=[...grid];f.basePilots=[...grid];f.enabled=index===0;}});}
function processPreliminaryRound(race,round){const finals=race.finals.filter(f=>f.type==='prelim'&&f.round===round);if(!finals.length||!finals.every(f=>f.saved))return;const winners=finals.map(f=>classifiedForAdvancement(f.result)[0]?.pilotId).filter(Boolean);if(winners.length<=6){if(!finalByName(race,`LCQ-F${round}`))race.finals.push(createFinal(`LCQ-F${round}`,winners,{type:'final-lcq',label:'Заключительный LCQ',round:round+1,order:500+round,enabled:true,advanceCount:2}));}else{const next=round+1;if(!race.finals.some(f=>f.type==='prelim'&&f.round===next))createPreliminaryRound(race,winners,next,100+next*50);}}
function advanceFinalists(race,final){if(final.type==='single-lcq'){setMainGrid(race,classifiedForAdvancement(final.result).slice(0,2).map(i=>i.pilotId));return;}if(final.type==='dual-lcq'){const pair=race.finals.filter(f=>f.type==='dual-lcq');if(pair.every(f=>f.saved)){const rank=qualificationRankMap(race),w=pair.map(f=>classifiedForAdvancement(f.result)[0]?.pilotId).filter(Boolean).sort((a,b)=>(rank.get(String(a))||9999)-(rank.get(String(b))||9999));setMainGrid(race,w);}return;}if(final.type==='prelim'){processPreliminaryRound(race,final.round);return;}if(final.type==='final-lcq'){setMainGrid(race,classifiedForAdvancement(final.result).slice(0,2).map(i=>i.pilotId));return;}if(final.type==='main'){const idx=FINAL_A_RUNS.indexOf(final.name);if(idx<2){const n=finalByName(race,FINAL_A_RUNS[idx+1]);if(n)n.enabled=true;}else buildFinalProtocol(race);}}
function saveFinalEvent(race,eventKey,result){const final=race.finals.find(f=>f.key===eventKey);if(!final||!final.enabled||final.saved)throw new Error('Финал закрыт или уже сохранён');final.result=normalizeResult(result).sort(compareFinalResultItems);final.saved=true;final.result.forEach((item,index)=>{const p=getPilot(race,item.pilotId);if(p)p.finalResults.push({final:final.name,place:item.place,status:item.status,dnfOrder:item.dnfOrder,order:index+1});});advanceFinalists(race,final);return final;}
function mainRunScore(item){return item?.status==='FIN'?Number(item.place||7):7;}
function buildMainStandings(race){const rank=qualificationRankMap(race),main=FINAL_A_RUNS.map(n=>finalByName(race,n)).filter(Boolean),pilotIds=main[0]?.pilots||[];return pilotIds.map(pilotId=>{const results=main.map(f=>f.saved?(f.result.find(i=>String(i.pilotId)===String(pilotId))||{status:'DNS'}):null),scores=results.map(i=>i?mainRunScore(i):null),done=scores.filter(Number.isFinite),bestTwo=[...done].sort((a,b)=>a-b).slice(0,2),latest=[...scores].reverse().find(Number.isFinite);return{pilotId,results,scores,bestTwo,total:bestTwo.length?bestTwo.reduce((s,v)=>s+v,0):null,wins:results.filter(i=>i?.status==='FIN'&&i.place===1).length,seconds:results.filter(i=>i?.status==='FIN'&&i.place===2).length,lastScore:latest??9999,qRank:rank.get(String(pilotId))||9999};}).sort((a,b)=>{if(a.total===null&&b.total!==null)return 1;if(a.total!==null&&b.total===null)return-1;if(a.total!==b.total)return(a.total??9999)-(b.total??9999);return b.wins-a.wins||b.seconds-a.seconds||a.lastScore-b.lastScore||a.qRank-b.qRank;});}
function buildFinalProtocol(race){const main=buildMainStandings(race),added=new Set(main.map(i=>String(i.pilotId))),eliminated=[],rank=qualificationRankMap(race),groups=new Map();race.finals.filter(f=>f.saved&&f.type!=='main').forEach(f=>{const k=f.type==='dual-lcq'?'dual-lcq':f.type==='prelim'?`prelim-${f.round}`:`${f.type}-${f.order}`;if(!groups.has(k))groups.set(k,{order:f.order,finals:[]});groups.get(k).order=Math.max(groups.get(k).order,f.order);groups.get(k).finals.push(f);});[...groups.values()].sort((a,b)=>b.order-a.order).forEach(g=>{const c=[];g.finals.forEach(f=>[...f.result].sort(compareFinalResultItems).forEach((i,index)=>c.push({...i,resultOrder:index+1,source:f.label})));c.sort((a,b)=>a.resultOrder-b.resultOrder||(rank.get(String(a.pilotId))||9999)-(rank.get(String(b.pilotId))||9999));c.forEach(i=>{if(!added.has(String(i.pilotId))){eliminated.push({pilotId:i.pilotId,status:i.status,source:i.source});added.add(String(i.pilotId));}});});race.pilots.forEach(p=>{if(!added.has(String(p.id)))eliminated.push({pilotId:p.id,status:'NC',source:'Квалификация'});});const rows=[...main.map(i=>({pilotId:i.pilotId,status:'FIN',source:`Финал A · ${i.total} очк.`})),...eliminated];race.finalProtocol=rows.map((i,index)=>({place:index+1,pilotId:i.pilotId,status:i.status,source:i.source,eventPoints:['DNS','DSQ'].includes(i.status)?0:(EVENT_POINTS[index]||0)}));race.stage='finished';race.lifecycleStatus='completed';race.completedAt=new Date().toISOString();return race.finalProtocol;}

function normalizeResult(items){
  const arr=(items||[]).map(i=>({pilotId:i.pilotId,status:i.status||'FIN',place:i.status==='FIN'||!i.status?Number(i.place)||null:null,dnfOrder:i.status==='DNF'?Number(i.dnfOrder)||null:null}));
  const fins=arr.filter(i=>i.status==='FIN').sort((a,b)=>(a.place||999)-(b.place||999));fins.forEach((i,idx)=>i.place=idx+1);
  const dnfs=arr.filter(i=>i.status==='DNF');dnfs.forEach((i,idx)=>i.dnfOrder=i.dnfOrder||idx+1);
  return arr.sort(compareFinalResultItems);
}

function eventList(race){
  const q=race.heats.map(h=>({...h,phase:'qualifying'}));const f=race.finals.map(x=>({...x,phase:'finals'}));return [...q,...f].sort((a,b)=>{if(a.phase!==b.phase)return a.phase==='qualifying'?-1:1;return(a.order||0)-(b.order||0);});
}
function currentEvent(race){const all=eventList(race);return all.find(e=>!e.saved&&e.enabled)||all.find(e=>!e.saved&&e.phase==='qualifying')||null;}
function eventStatus(race,event){if(event.saved)return'completed';const cur=currentEvent(race);if(cur&&cur.key===event.key)return'current';if(event.enabled)return'ready';return'locked';}
function eventRule(race,event){
  if(!event)return null;
  const rs=race.raceSettings||{};
  if(event.type==='qualifying'){
    const limitType=rs.qualificationLimitType||'time';
    return {mode:'qualification',limitType,durationMin:limitType==='time'?Number(rs.qualificationMinutes||5):0,targetLaps:limitType==='laps'?Number(rs.qualificationLaps||8):0,minLapSec:Number(rs.minLapSec||2),finishCurrentLap:true};
  }
  const limitType=rs.finalLimitType||'laps';
  return {mode:'race',limitType,durationMin:limitType==='time'?Number(rs.finalMinutes||5):0,targetLaps:limitType==='laps'?Number(rs.finalLaps||7):0,minLapSec:Number(rs.minLapSec||2),finishCurrentLap:true};
}
function getEventPilots(race,event){return(event?.pilots||[]).map(id=>getPilot(race,id)).filter(Boolean);}


'use strict';

const UUID={SERVICE:'0000fff0-0000-1000-8000-00805f9b34fb',COMMAND:'0000fff3-0000-1000-8000-00805f9b34fb',NOTIFY:'0000fff4-0000-1000-8000-00805f9b34fb'};

const ANNOUNCER_AUDIO={
  prestart10:'./audio/voice/prestart_10.wav',
  goodRace:'./audio/voice/good_race.wav',
  startRace:'./audio/system/start_race.mp3',
  bleep:'./audio/system/bleep.mp3',

    3:'./audio/voice/warmup_03.wav',

    5:'./audio/voice/warmup_05.wav',

};
class AnnouncerEngine extends EventTarget{
  constructor(){
    super();
    this.enabled=true;
    this.startMode='full';
    this.token=0;
    this.lastMessage='Готов к старту';
    this.lastError='';
    this.unlocked=false;
    this.unlockPromise=null;
    this.mainPlayer=null;       // VOICE + HORN: один постоянный media element
    this.bleepPool=[];          // SFX: отдельные media elements, могут играть поверх диктора
    this.bleepIndex=0;
    this.preloadCache=new Map();// только прогрев HTTP/media cache и получение duration
  }
  emit(detail){this.dispatchEvent(new CustomEvent('status',{detail}));}
  assetUrl(key){
    if(key.startsWith('countdown_'))return ANNOUNCER_AUDIO.countdown[Number(key.split('_')[1])];
    if(key.startsWith('warmup_'))return ANNOUNCER_AUDIO.warmup[Number(key.split('_')[1])];

  allKeys(){return ['prestart10','goodRace','startRace',...Array.from({length:10},(_,i)=>`countdown_${i+1}`),...'12345'.split('').map(n=>`warmup_${n}`),'warmup_30'];}

    a.dataset.legionAudio=role;
    const host=document.getElementById('legionAudioHost');if(host)host.appendChild(a);
    return a;
  }
  ensurePlayers(){
    if(!this.mainPlayer)this.mainPlayer=this.createPlayer('main');
    if(!this.bleepPool.length)this.bleepPool=Array.from({length:8},(_,i)=>this.createPlayer(`bleep-${i+1}`));
  }
  getAudio(key){
    if(this.preloadCache.has(key))return this.preloadCache.get(key);

    const a=document.createElement('audio');a.preload='auto';a.src=src;a.playsInline=true;
    try{a.load();}catch{}

  }
  preload(){

  showGate(message='Нужно один раз включить звук'){

  async unlockFromGesture({confirmation=true}={}){

        this.setGate('Звук готов','ok');

  setSource(a,key,src){

function ensureSession(ev){if(!ev)return null;if(state.session?.eventKey!==ev.key){state.session={eventKey:ev.key,phase:'ready',startedAtPerf:null,runStartedAtPerf:null,accumulatedElapsedMs:0,startedAtEpoch:null,finishedAtEpoch:null,countdownLeft:state.race.raceSettings.countdownSec,extraMinutes:0,live:Object.fromEntries(getEventPilots(state.race,ev).map(p=>[p.id,blankLive()])),unknown:{},lastPass:'',phaseBeforePause:'running'};}return state.session;}
function sessionElapsed(s){if(!s)return 0;if(s.phase==='paused'||s.phase==='finished')return Number(s.accumulatedElapsedMs||0);if(!s.runStartedAtPerf)return Number(s.accumulatedElapsedMs||0);return Number(s.accumulatedElapsedMs||0)+(performance.now()-s.runStartedAtPerf);}
function startTicker(){if(state.sessionTick)clearInterval(state.sessionTick);state.sessionTick=setInterval(()=>{if(state.view!=='cockpit')return;updateDynamicCockpit();checkSessionLimit();},120);}
function updateDynamicCockpit(){const ev=currentEvent(state.race),s=state.session;const timer=$('#mainTimer');if(timer)timer.textContent=displayTimer(s,ev);const ring=$('#timerRing');if(ring)ring.style.setProperty('--progress',timerProgress(s,ev));const clock=$('#cockpitClock');if(clock)clock.textContent=clockNow();const lastId=$('#lastLapwizId');if(lastId)lastId.textContent=lapwiz.lastId||'—';const board=$('.pilotBoardTable');if(board&&ev&&s&&s.phase!=='finished'){const ranked=liveRanking(getEventPilots(state.race,ev),s);board.innerHTML=pilotTable(ranked,s);bindManualPasses();}}
async function beginCountdown(){
 const ev=currentEvent(state.race),s=ensureSession(ev);if(!ev||s.phase!=='ready')return;
 const seconds=Math.max(1,Math.min(10,Math.round(Number(state.race.raceSettings.countdownSec||state.settings.countdownSec)||10)));
 s.phase='countdown';s.countdownLeft=seconds;render();
 announcer.preload();
 await announcer.runStartSequence({
   seconds,
   mode:state.settings.startVoiceMode||'full',
   onTick:n=>{s.countdownLeft=n;updateDynamicCockpit();},
   onStart:async()=>{if(s.phase==='countdown')await beginRaceNow();}
 });
}
async function beginRaceNow(){const ev=currentEvent(state.race),s=ensureSession(ev),rule=eventRule(state.race,ev);try{if(lapwiz.connected)await lapwiz.start(rule);}catch(e){toast(`LapWiz START: ${e.message}`);return;}s.phase='running';s.startedAtPerf=performance.now();s.runStartedAtPerf=s.startedAtPerf;s.accumulatedElapsedMs=0;s.startedAtEpoch=Date.now();s.finishedAtEpoch=null;s.timeExpired=false;s.extraMinutes=0;Object.values(s.live).forEach(v=>Object.assign(v,blankLive()));logEvent(`Старт: ${ev.label}`);startTicker();render();}
async function finishSession(reason='Финиш судьёй'){const s=state.session;if(!s)return;if(s.phase!=='paused')s.accumulatedElapsedMs=sessionElapsed(s);if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();}catch(e){toast(`STOP: ${e.message}`);}}s.phase='finished';s.runStartedAtPerf=null;s.finishedAtEpoch=Date.now();logEvent(reason);state.resultsOpen=true;state.widgetCollapsed.results=false;render();}
async function stopSession(){
 const s=state.session;
 if(s?.phase==='countdown'){
   announcer.cancel();
   if(state.countdownTick){clearInterval(state.countdownTick);state.countdownTick=null;}
   s.phase='ready';s.countdownLeft=state.race?.raceSettings?.countdownSec||state.settings.countdownSec||10;
   logEvent('Стартовый отсчёт отменён');render();return;
 }
 announcer.cancel();
 if(state.countdownTick){clearInterval(state.countdownTick);state.countdownTick=null;}
 await finishSession('Аварийный STOP');
}
function checkSessionLimit(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||s.phase!=='running')return;const r=eventRule(state.race,ev),elapsed=sessionElapsed(s),limit=(r.durationMin+(s.extraMinutes||0))*60000;if(r.limitType==='time'&&elapsed>=limit&&!s.timeExpired){s.timeExpired=true;s.phase='finishing';Object.values(s.live).forEach(v=>{if(!v.finished)v.needsFinish=true;});toast('Время истекло — финиш на следующем проходе');}if(r.limitType==='laps'){const all=Object.values(s.live).every(v=>v.finished);if(all)finishSession('Все пилоты финишировали');}}
function processPass(transponder,deviceMs=null,source='MANUAL'){lapwiz.lastId=String(transponder);const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return;const p=getEventPilots(state.race,ev).find(x=>String(x.transponder)===String(transponder));if(!p){s.unknown[transponder]=(s.unknown[transponder]||0)+1;if(source==='LAPWIZ')lapwiz.unknownBeep();toast(`Неизвестный ID ${transponder}`);return;}if(source==='LAPWIZ'&&state.settings.lapSound)announcer.playBleep();processPilotPass(p,deviceMs,source);}
function processPilotPass(p,deviceMs=null,source='MANUAL'){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return;const l=s.live[p.id]||blankLive();if(l.finished)return;const now=performance.now(),elapsedNow=sessionElapsed(s);let lapMs=null;if(Number.isFinite(deviceMs)&&source==='LAPWIZ'){if(Number.isFinite(l.lastDeviceMs)&&deviceMs>l.lastDeviceMs)lapMs=deviceMs-l.lastDeviceMs;else if(!l.lastDeviceMs&&deviceMs>0)lapMs=deviceMs;l.lastDeviceMs=deviceMs;}if(!Number.isFinite(lapMs)||lapMs<=0)lapMs=elapsedNow-(Number.isFinite(l.lastElapsedAtPass)?l.lastElapsedAtPass:0);l.lastElapsedAtPass=elapsedNow;l.lastPassPerf=now;l.lastLapMs=lapMs;l.bestLapMs=Math.min(l.bestLapMs,lapMs);l.laps++;l.elapsedMs=elapsedNow;const rule=eventRule(state.race,ev);if(rule.limitType==='laps'&&l.laps>=rule.targetLaps){l.finished=true;l.finishedAt=l.elapsedMs;}if(s.phase==='finishing'&&s.timeExpired){l.finished=true;l.finishedAt=l.elapsedMs;}s.live[p.id]=l;s.lastPass=`${p.name} · ${l.laps} · ${fmtMs(lapMs)}`;updateDynamicCockpit();if(Object.values(s.live).every(v=>v.finished)&&(rule.limitType==='laps'||s.phase==='finishing'))finishSession('Все пилоты завершили заезд');}
function logEvent(text){state.race.runtime.eventLog.push({time:new Date().toISOString(),text});persistRace();}
function makeDraftResult(pilots,session){return pilots.map((p,i)=>{const l=session?.live?.[p.id]||blankLive();return{pilotId:p.id,name:p.name,status:'FIN',place:i+1,laps:l.laps,elapsedMs:l.elapsedMs};});}
function readEditedResult(){const ev=currentEvent(state.race),ranked=liveRanking(getEventPilots(state.race,ev),state.session);return ranked.map((p,i)=>{const st=document.querySelector(`[data-result-status="${CSS.escape(String(p.id))}"]`)?.value||'FIN',place=Number(document.querySelector(`[data-result-place="${CSS.escape(String(p.id))}"]`)?.value||i+1);return{pilotId:p.id,status:st,place:st==='FIN'?place:null,dnfOrder:st==='DNF'?i+1:null};});}
function saveCurrentEventResult(){const race=state.race,ev=currentEvent(race),s=state.session;if(!ev||s?.phase!=='finished')return toast('Сначала завершите заезд');try{const result=readEditedResult();if(ev.type==='qualifying')saveQualifyingEvent(race,ev.key,result);else saveFinalEvent(race,ev.key,result);syncChampionshipIfFinished(race);persistRace();state.session=null;state.resultsOpen=false;toast('Результат сохранён. Следующий заезд подготовлен.');render();}catch(e){toast(e.message);}}

async function togglePause(){const s=state.session;if(!s)return;if(lapwiz.connected)return toast('Пауза с LapWiz будет включена после отдельного протокольного теста');if(s.phase==='running'){s.accumulatedElapsedMs=sessionElapsed(s);s.runStartedAtPerf=null;s.phaseBeforePause='running';s.phase='paused';logEvent('Пауза');render();return;}if(s.phase==='paused'){s.runStartedAtPerf=performance.now();s.phase=s.phaseBeforePause||'running';logEvent('Продолжение заезда');render();}}
function addMinute(){const s=state.session,ev=currentEvent(state.race);if(!s||!ev)return;if(lapwiz.connected)return toast('+1 мин с LapWiz подключим после отдельного теста');const r=eventRule(state.race,ev);if(r.limitType!=='time')return toast('+1 мин доступна только для заезда по времени');s.extraMinutes=(s.extraMinutes||0)+1;s.timeExpired=false;if(s.phase==='finishing')s.phase='running';logEvent('Добавлена 1 минута');toast('Добавлена 1 минута');render();}
function manualPassPicker(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return toast('Сначала запустите заезд');const pilots=liveRanking(getEventPilots(state.race,ev),s);$('#modalHost').innerHTML=`<div class="modalBackdrop"><div class="modal manualPassModal"><div class="modalHead"><div><div class="sectionLabel">РУЧНОЙ РЕЗЕРВ</div><h2>Кому засчитать круг?</h2></div><button class="iconBtn" id="closeModal">×</button></div><div class="manualPilotGrid">${pilots.map(p=>{const l=s.live[p.id]||blankLive();return `<button class="manualPilotBtn" data-manual-picker="${p.id}" ${l.finished?'disabled':''}><span>${esc(p.name)}</span><b>${l.laps} кр.</b></button>`;}).join('')}</div></div></div>`;$('#closeModal').onclick=closeModal;$$('[data-manual-picker]').forEach(b=>b.onclick=()=>{const p=getPilot(state.race,b.dataset.manualPicker);if(p){processPilotPass(p,null,'MANUAL');closeModal();}});}
function quickNextEvent(){const race=state.race,ev=currentEvent(race),s=state.session;if(!ev||s?.phase!=='finished')return toast('Сначала завершите текущий заезд');if(!confirm('Сохранить текущий порядок финиша и перейти к следующему заезду? Для DNF/DNS/DSQ используйте виджет «Результаты заезда».'))return;try{const ranked=liveRanking(getEventPilots(race,ev),s),result=ranked.map((p,i)=>({pilotId:p.id,status:'FIN',place:i+1,dnfOrder:null}));if(ev.type==='qualifying')saveQualifyingEvent(race,ev.key,result);else saveFinalEvent(race,ev.key,result);syncChampionshipIfFinished(race);persistRace();state.session=null;state.resultsOpen=false;state.widgetCollapsed.results=true;toast('Результат сохранён. Следующий заезд готов.');render();}catch(e){toast(e.message);}}

function normalizeChampionship(c){
 c.stages=c.stages||[];c.stagePlans=c.stagePlans||[];c.pilotIds=c.pilotIds||[];c.stagesPlanned=Number(c.stagesPlanned||6);if(!c.stagePlans.length&&c.stages.length)c.stagePlans=c.stages.map(s=>({id:uid('stage'),number:s.number,name:s.name||`Этап ${s.number}`,date:s.date||'',location:s.location||'',status:'completed',raceId:s.raceId||''}));return c;
}
function championshipsView(){state.championships.forEach(normalizeChampionship);return `<section class="page"><div class="pageHeader"><div><div class="sectionLabel">СЕЗОНЫ</div><h1>Чемпионаты</h1><p>Сезон, этапы, календарь, состав пилотов и общая рейтинговая таблица.</p></div><button class="btn primary" data-action="new-champ">＋ Чемпионат</button></div><div class="grid grid2">${state.championships.length?state.championships.map(c=>champCard(c)).join(''):`<div class="card empty">Пока нет чемпионатов.</div>`}</div></section>`;}
function champCard(c){normalizeChampionship(c);const standings=champStandings(c),active=c.stagePlans.filter(s=>s.status==='active').length;return `<article class="card championshipCard"><div class="sectionLabel">${esc(c.season)}</div><div class="champTitleRow"><div><h2>${esc(c.name)}</h2><p>${c.stagePlans.length} запланировано · ${c.stages.length} завершено${active?` · ${active} активно`:''}</p></div><button class="btn primary" data-open-champ="${c.id}">Войти в чемпионат ${uiIcon('chevron','btnIcon')}</button></div>${standings.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Место</th><th>Пилот</th><th>Очки</th></tr></thead><tbody>${standings.slice(0,5).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td><b>${r.total}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Нет завершённых этапов.</div>`}</article>`;}
function champStandings(c){const m=new Map();(c.stages||[]).forEach(s=>(s.results||[]).forEach(r=>{const row=m.get(r.driverId)||{driverId:r.driverId,name:r.name,total:0,stages:0};row.total+=Number(r.points||0);row.stages++;m.set(r.driverId,row);}));return[...m.values()].sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));}
function championshipDetailView(){
 const c=state.championships.find(x=>x.id===state.activeChampionshipId);if(!c)return `<section class="page"><div class="card empty">Чемпионат не найден.</div></section>`;normalizeChampionship(c);
 const tabs=[['stages','Этапы'],['schedule','Расписание'],['pilots','Пилоты'],['standings','Рейтинг'],['settings','Настройки']];
 return `<section class="page championshipDetail"><div class="pageHeader"><div><div class="sectionLabel">${esc(c.season)} · ЧЕМПИОНАТ</div><h1>${esc(c.name)}</h1><p>${c.stagePlans.length} этапов в календаре · ${c.stages.length} завершено</p></div><button class="btn secondary" data-action="back-champs">← Все чемпионаты</button></div><nav class="sectionTabs">${tabs.map(([k,l])=>`<button class="${state.champTab===k?'active':''}" data-champ-tab="${k}">${l}</button>`).join('')}</nav>${championshipTabContent(c)}</section>`;
}

 if(state.champTab==='schedule'){const plans=[...c.stagePlans].sort((a,b)=>(a.number||0)-(b.number||0));return `<div class="card"><div class="sectionLabel">КАЛЕНДАРЬ</div><h2>Расписание этапов</h2>${plans.length?`<div class="scheduleList">${plans.map(s=>`<div class="scheduleRow"><b>${s.number}. ${esc(s.name)}</b><span>${esc(s.date||'Дата не задана')}</span><span>${esc(s.location||'Место не задано')}</span><em class="stageStatus ${s.status||'planned'}">${stagePlanStatus(s)}</em></div>`).join('')}</div>`:`<div class="empty">Этапы ещё не добавлены.</div>`}</div>`;}
 if(state.champTab==='pilots'){const pilots=c.pilotIds.map(id=>state.pilotDb.find(p=>p.id===id)).filter(Boolean);return `<div class="card"><div class="pageHeader compactHeader"><div><div class="sectionLabel">СОСТАВ</div><h2>Пилоты чемпионата · ${pilots.length}</h2></div><button class="btn primary" data-action="champ-add-pilots">＋ Добавить из базы</button></div><div class="list">${pilots.length?pilots.map(p=>`<div class="listRow"><div class="avatar">${nameInitials(p.name)}</div><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.club||'Без клуба')} · ID ${esc(p.transponder||'—')}</div></div><button class="btn secondary" data-champ-remove-pilot="${p.id}">Убрать</button></div>`).join(''):`<div class="empty">Состав пока пуст. Можно добавить пилотов заранее или оставить этапы со своим составом.</div>`}</div></div>`;}
 if(state.champTab==='standings'){const standings=champStandings(c);return `<div class="card"><div class="sectionLabel">РЕЙТИНГ</div><h2>Таблица чемпионата</h2>${standings.length?`<div class="tableWrap"><table class="table"><thead><tr><th>POS</th><th>Пилот</th><th>Этапов</th><th>Очки</th></tr></thead><tbody>${standings.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.stages}</td><td><b>${r.total}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Рейтинг появится после завершения первого этапа.</div>`}</div>`;}
 const plans=[...c.stagePlans].sort((a,b)=>(a.number||0)-(b.number||0));return `<div class="champStagesHead"><div><div class="sectionLabel">ЭТАПЫ</div><h2>Этапы чемпионата</h2></div><button class="btn primary" data-action="new-champ-stage">＋ Этап</button></div><div class="champStageGrid">${plans.length?plans.map(s=>champStageCard(c,s)).join(''):`<div class="card empty">Создайте первый этап чемпионата.</div>`}</div>`;

function stagePlanStatus(s){return s.status==='completed'?'Завершён':s.status==='active'?'Идёт сейчас':'Запланирован';}
function champStageCard(c,s){const activeRace=state.race&&state.race.id===s.raceId;const archived=s.raceId&&state.archive.some(r=>r.id===s.raceId);return `<article class="card champStageCard"><div class="stageCardTop"><span class="stageNo">${s.number}</span><span class="stageStatus ${s.status||'planned'}">${stagePlanStatus(s)}</span></div><h3>${esc(s.name)}</h3><p>${esc(s.date||'Дата не задана')} · ${esc(s.location||'Место не задано')}</p><div class="btnRow"><button class="btn secondary" data-edit-stage="${s.id}">Настроить этап</button>${s.status==='completed'?`<button class="btn secondary" data-stage-results="${s.raceId||''}">Результаты</button>`:activeRace?`<button class="btn primary" data-continue-stage="${s.id}">Продолжить гонку</button>`:archived?`<button class="btn primary" data-continue-stage="${s.id}">Восстановить / продолжить</button>`:`<button class="btn primary" data-start-stage="${s.id}">Начать гонку</button>`}</div></article>`;}
function syncChampionshipIfFinished(race){if(race.stage!=='finished'||!race.championshipId)return;const c=state.championships.find(x=>x.id===race.championshipId);if(!c)return;normalizeChampionship(c);const stageNo=Number(race.championshipStageNumber)||((c.stages?.length||0)+1),results=race.finalProtocol.map(r=>{const p=getPilot(race,r.pilotId);return{driverId:p.profileId||p.id,name:p.name,place:r.place,points:r.eventPoints,status:r.status};});const stage={number:stageNo,raceId:race.id,name:race.eventName,date:race.eventDate,location:race.eventLocation,results};const idx=c.stages.findIndex(s=>s.raceId===race.id||s.number===stageNo);if(idx>=0)c.stages[idx]=stage;else c.stages.push(stage);const plan=c.stagePlans.find(s=>s.id===race.championshipStageId||s.number===stageNo);if(plan){plan.status='completed';plan.raceId=race.id;plan.name=race.eventName;plan.date=race.eventDate;plan.location=race.eventLocation;}save(KEYS.champ,state.championships);}

async function pauseSession(){const s=state.session;if(!s)return;if(s.phase==='paused')return resumeSession();if(!['running','finishing'].includes(s.phase))return;s.elapsedBeforePause=sessionElapsed(s);s.startedAtPerf=null;s.resumePhase=s.phase;s.phase='paused';Object.values(s.live).forEach(v=>{v.lastPassPerf=null;v.lastDeviceMs=null;});if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();}catch(e){toast(`LapWiz STOP: ${e.message}`);}}logEvent('Пауза');render();}
async function resumeSession(){const ev=currentEvent(state.race),s=state.session;if(!ev||s?.phase!=='paused')return;const rule=eventRule(state.race,ev);if(lapwiz.connected){try{const rr={...rule};if(rr.limitType==='time')rr.durationMin=Math.max(1/60,(timerTotalMs(ev,s)-sessionElapsed(s))/60000);await lapwiz.start(rr);}catch(e){toast(`LapWiz RESUME: ${e.message}`);return;}}s.phase=s.resumePhase||'running';s.startedAtPerf=performance.now();Object.values(s.live).forEach(v=>{v.lastPassPerf=null;v.lastDeviceMs=null;});logEvent('Продолжение после паузы');startTicker();render();}
async function addMinute(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s)return;const rule=eventRule(state.race,ev);if(rule.limitType!=='time')return toast('+1 мин доступна только для заезда по времени');s.extraMs=(s.extraMs||0)+60000;if(s.phase==='finishing'&&sessionElapsed(s)<timerTotalMs(ev,s)){s.phase='running';s.timeExpired=false;Object.values(s.live).forEach(v=>v.needsFinish=false);}if(s.phase==='paused'&&s.resumePhase==='finishing'&&sessionElapsed(s)<timerTotalMs(ev,s)){s.resumePhase='running';s.timeExpired=false;Object.values(s.live).forEach(v=>v.needsFinish=false);}logEvent('Добавлена 1 минута');if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();const remaining=Math.max(1000,timerTotalMs(ev,s)-sessionElapsed(s));await lapwiz.start({...rule,durationMin:remaining/60000});Object.values(s.live).forEach(v=>{v.lastDeviceMs=null;});}catch(e){toast(`LapWiz +1 мин: ${e.message}`);}}toast('К заезду добавлена 1 минута');updateDynamicCockpit();}
async function finishSession(reason='Финиш судьёй'){const s=state.session;if(!s)return;const elapsed=sessionElapsed(s);if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();}catch(e){toast(`STOP: ${e.message}`);}}s.elapsedFinalMs=elapsed;s.phase='finished';s.finishedAtEpoch=Date.now();logEvent(reason);state.resultsOpen=true;state.widgetCollapsed.results=false;render();}
function checkSessionLimit(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||s.phase!=='running')return;const r=eventRule(state.race,ev),elapsed=sessionElapsed(s);if(r.limitType==='time'&&elapsed>=r.durationMin*60000+(s.extraMs||0)&&!s.timeExpired){s.timeExpired=true;s.phase='finishing';Object.values(s.live).forEach(v=>{if(!v.finished)v.needsFinish=true;});toast('Время истекло — финиш на следующем проходе');}if(r.limitType==='laps'){const all=Object.values(s.live).every(v=>v.finished);if(all)finishSession('Все пилоты финишировали');}}
function processPilotPass(p,deviceMs=null,source='MANUAL'){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return;const l=s.live[p.id]||blankLive();if(l.finished)return;const now=performance.now();let lapMs=null;if(Number.isFinite(deviceMs)){if(Number.isFinite(l.lastDeviceMs)&&deviceMs>l.lastDeviceMs)lapMs=deviceMs-l.lastDeviceMs;else if(Number.isFinite(l.lastPassPerf))lapMs=now-l.lastPassPerf;else if(deviceMs>0)lapMs=deviceMs;l.lastDeviceMs=deviceMs;}if(!Number.isFinite(lapMs)||lapMs<=0)lapMs=now-(l.lastPassPerf??s.startedAtPerf??now);l.lastPassPerf=now;l.lastLapMs=lapMs;l.bestLapMs=Math.min(l.bestLapMs,lapMs);l.laps++;l.elapsedMs=sessionElapsed(s);const rule=eventRule(state.race,ev);if(rule.limitType==='laps'&&l.laps>=rule.targetLaps){l.finished=true;l.finishedAt=l.elapsedMs;}if(s.phase==='finishing'&&s.timeExpired){l.finished=true;l.finishedAt=l.elapsedMs;}s.live[p.id]=l;s.lastPass=`${p.name} · ${l.laps} · ${fmtMs(lapMs)}`;updateDynamicCockpit();if(Object.values(s.live).every(v=>v.finished)&&(rule.limitType==='laps'||s.phase==='finishing'))finishSession('Все пилоты завершили заезд');}
function manualLapModal(){const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return toast('Ручной круг доступен во время заезда');const pilots=liveRanking(getEventPilots(state.race,ev),s);$('#modalHost').innerHTML=`<div class="modalBackdrop"><div class="modal manualLapModal"><div class="modalHead"><div><div class="sectionLabel">РУЧНОЙ РЕЗЕРВ</div><h2>Кому добавить круг?</h2></div><button class="iconBtn" id="closeModal">×</button></div><div class="manualPilotGrid">${pilots.map(p=>{const l=s.live[p.id]||blankLive();return `<button data-manual-modal="${p.id}" ${l.finished?'disabled':''}><span>${nameInitials(p.name)}</span><b>${esc(p.name)}</b><em>${l.laps} кругов</em></button>`;}).join('')}</div></div></div>`;$('#closeModal').onclick=closeModal;$$('[data-manual-modal]').forEach(b=>b.onclick=()=>{const p=getPilot(state.race,b.dataset.manualModal);if(p){processPilotPass(p,null,'MANUAL');toast(`Ручной круг: ${p.name}`);closeModal();}});}
async function handleAction(action,button){if(action==='pause-session')return pauseSession();if(action==='add-minute')return addMinute();if(action==='next-event'){if(state.session?.phase!=='finished')return toast('Сначала завершите текущий заезд');return saveCurrentEventResult();}if(action==='manual-lap-modal')return manualLapModal();if(action==='open-settings')return nav('settings');return legacyHandleAction(action,button);}

/* ===== Legion RX 4.0.10 Alpha · Warmup / Prestart ===== */

function buildStartTiming(flag){return buildProtocolPacket(0x06,[flag?1:0]);}

LapWizCore.prototype.start=async function(settings){
  const ack=this.ack('start');
  this.currentMode=settings?.mode||'race';
  this.practiceTimingStarted=this.currentMode!=='practice';
  await this.write(buildStartWork(settings),'START');
  await ack;
  this.running=true;
  this.emit('status',{connected:true,running:true,mode:this.currentMode,name:this.device?.name||'LapWiz'});
};
LapWizCore.prototype.startTiming=async function(flag=0){
  if(!this.connected||!this.cmdChar)return;
  try{
    const ack=this.ack('timing');
    await this.write(buildStartTiming(flag),`START_TIMING(${flag})`);
    await ack;
  }catch(e){
    console.warn('START_TIMING',e);
    this.emit('log',{kind:'error',label:'START_TIMING',error:String(e)});
  }
};
LapWizCore.prototype.stop=async function(){
  if(!this.connected||!this.cmdChar){this.running=false;this.currentMode='';this.practiceTimingStarted=false;return;}
  const ack=this.ack('stop');
  await this.write(STOP,'STOP');
  try{await ack;}
  finally{
    this.running=false;this.currentMode='';this.practiceTimingStarted=false;
    this.emit('status',{connected:true,running:false,name:this.device?.name||'LapWiz'});
  }
};
LapWizCore.prototype.handleFrame=function(frame){
  const cmd=frame[2],raw=bytesToHex(frame);
  if(cmd===0x03&&frame[1]===0x04){
    const result=frame[4]??0;
    if(this.pending.start)result===0?this.pending.start.resolve(frame):this.pending.start.reject(new Error(`START result=${result}`));
    return;
  }
  if(cmd===0x04&&frame[1]===0x04){
    const result=frame[4]??0;
    if(this.pending.stop)result===0?this.pending.stop.resolve(frame):this.pending.stop.reject(new Error(`STOP result=${result}`));
    return;
  }
  if(cmd===0x06&&frame[1]===0x04){
    const result=frame[4]??0;
    if(this.pending.timing)result===0?this.pending.timing.resolve(frame):this.pending.timing.reject(new Error(`START_TIMING result=${result}`));
    return;
  }
  if(cmd===0x02&&frame.length>=13){
    const id=((frame[4]<<8)|frame[5])>>>0;
    const ticks=((((frame[6]<<24)>>>0)+(frame[7]<<16)+(frame[8]<<8)+frame[9])>>>0);
    this.emit('pass',{transponder:String(id),deviceTicks:ticks,deviceMs:ticks*10,raw,source:'LAPWIZ'});
    if(this.running&&this.currentMode==='practice'&&!this.practiceTimingStarted){
      this.practiceTimingStarted=true;
      this.startTiming(0);
    }
    return;
  }
  this.emit('log',{kind:'rx',raw});
};

AnnouncerEngine.prototype.speakText=function(text){
  if(!this.enabled||!text||!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ru-RU';u.rate=.96;u.pitch=1.02;u.volume=1;
    const voices=window.speechSynthesis.getVoices?.()||[];
    const ru=voices.find(v=>/^ru/i.test(v.lang)&&/female|жен|alena|milena|irina|svetlana/i.test(v.name))||voices.find(v=>/^ru/i.test(v.lang));
    if(ru)u.voice=ru;
    window.speechSynthesis.speak(u);
  }catch(e){console.warn('SpeechSynthesis',e);}
};
const _announcerCancel409=announcer.cancel.bind(announcer);
announcer.cancel=function(){
  try{window.speechSynthesis?.cancel();}catch{}
  return _announcerCancel409();
};

state.prestartTimers=state.prestartTimers||[];
function clearPrestartTimers(){(state.prestartTimers||[]).forEach(clearTimeout);state.prestartTimers=[];}
function schedulePrestartAt(perf,fn){const id=setTimeout(fn,Math.max(0,perf-performance.now()));state.prestartTimers.push(id);return id;}
function raceWarmupMinutes(){return Math.max(1,Math.min(5,Number(state.race?.raceSettings?.warmupMinutes??state.settings.warmupMinutes??2)));}
function warmupRemainingMs(s){return s?.warmupEndsAtPerf?Math.max(0,s.warmupEndsAtPerf-performance.now()):0;}
function warmupSeenCount(s){return Object.keys(s?.warmupDetected||{}).length;}
function minuteWords(n){return n===1?'одна минута':n===2?'две минуты':n===3?'три минуты':n===4?'четыре минуты':'пять минут';}

function announceWarmupMinute(n,initial=false){
  const text=`До старта ${minuteWords(n)}.`;
  announcer.play(`warmup_${n}`,{wait:false});
  // В присланном voice-pack отдельной записанной фразы приглашения нет.
  // Пока произносим только приглашение системным голосом после штатной минутной отметки.
  if(initial){
    const invite='Участникам заезда просьба выехать на трассу для проверки транспондеров.';
    const a=announcer.getAudio(`warmup_${n}`);
    const delay=Math.max(900,Math.round(((Number(a?.duration)||1.5)+0.12)*1000));
    const sid=setTimeout(()=>{
      if(state.session&&['warmup','countdown'].includes(state.session.phase))announcer.speakText(invite);
    },delay);
    state.prestartTimers.push(sid);
    if(state.session)state.session.announcerLine=`${text} ${invite}`;
  }else if(state.session)state.session.announcerLine=text;
  logEvent(`Диктор: ${initial?`${text} Участникам заезда просьба выехать на трассу для проверки транспондеров.`:text}`);
}
function announceWarmup30(){
  const text='До старта тридцать секунд.';
  announcer.play('warmup_30',{wait:false});
  if(state.session){state.session.announcerLine=text;logEvent(`Диктор: ${text}`);}
}

function scheduleAlignedStart(s){
  const deadline=s.warmupEndsAtPerf;
  const sec=Math.max(1,Math.min(10,Number(state.race?.raceSettings?.countdownSec||state.settings.countdownSec||10)));
  const mode=state.settings.startVoiceMode||'full';

  schedulePrestartAt(deadline-sec*1000,()=>{
    if(state.session!==s||!['warmup','countdown'].includes(s.phase))return;
    s.phase='countdown';s.countdownLeft=sec;render();
  });

  if(mode==='full'){
    if(sec===10){
      schedulePrestartAt(deadline-sec*1000-1650,()=>{
        if(state.session===s&&['warmup','countdown'].includes(s.phase))announcer.play('prestart10',{wait:false});
      });
    }
    for(let n=sec;n>=1;n--){
      if(n>=5&&n<=10){
        schedulePrestartAt(deadline-n*1000,()=>{
          if(state.session===s&&['warmup','countdown'].includes(s.phase)){
            s.countdownLeft=n;announcer.play(`countdown_${n}`,{wait:false});updateDynamicCockpit();
          }
        });
      }else if(n===4){
        schedulePrestartAt(deadline-4000,()=>{
          if(state.session===s&&['warmup','countdown'].includes(s.phase)){
            s.countdownLeft=4;announcer.play('goodRace',{wait:false});updateDynamicCockpit();
          }
        });
      }
    }
  }else{
    const first=Math.max(0,sec-1);
    schedulePrestartAt(deadline-first*1000-1300,()=>{
      if(state.session===s&&['warmup','countdown'].includes(s.phase))announcer.play('goodRace',{wait:false});
    });
    for(let n=first;n>=1;n--){
      schedulePrestartAt(deadline-n*1000,()=>{
        if(state.session===s&&['warmup','countdown'].includes(s.phase)){
          s.countdownLeft=n;announcer.play(`countdown_${n}`,{wait:false});updateDynamicCockpit();
        }
      });
    }
  }

  schedulePrestartAt(deadline,async()=>{
    if(state.session!==s||!['warmup','countdown'].includes(s.phase))return;
    s.countdownLeft=0;
    announcer.play('startRace',{wait:false,force:true});
    await beginRaceNow();
  });
}

async function beginCountdown(){
  const ev=currentEvent(state.race),s=ensureSession(ev);
  if(!ev||s.phase!=='ready')return;
  clearPrestartTimers();announcer.cancel();announcer.preload();
  const minutes=raceWarmupMinutes(),totalSec=minutes*60;

  if(lapwiz.connected){
    try{
      if(lapwiz.running&&lapwiz.currentMode!=='practice')await lapwiz.stop();
      if(!lapwiz.running){
        await lapwiz.start({mode:'practice',limitType:'time',durationMin:960,targetLaps:0,minLapSec:Number(state.race?.raceSettings?.minLapSec||state.settings.minLapSec||2)});
      }
    }catch(e){toast(`LapWiz Free Practice: ${e.message}`);return;}
  }

  s.phase='warmup';s.warmupTotalSec=totalSec;s.warmupEndsAtPerf=performance.now()+totalSec*1000;
  s.warmupDetected={};s.lastPass='';s.countdownLeft=state.race?.raceSettings?.countdownSec||state.settings.countdownSec||10;s.announcerLine='';
  Object.values(s.live).forEach(v=>Object.assign(v,blankLive()));
  logEvent(`Прогрев перед стартом: ${minutes} мин · LapWiz ${lapwiz.connected?'Free Practice':'не подключён'}`);

  announceWarmupMinute(minutes,true);
  for(let n=minutes-1;n>=1;n--){
    schedulePrestartAt(s.warmupEndsAtPerf-n*60000,()=>{
      if(state.session===s&&s.phase==='warmup')announceWarmupMinute(n,false);
    });
  }
  schedulePrestartAt(s.warmupEndsAtPerf-30000,()=>{
    if(state.session===s&&s.phase==='warmup')announceWarmup30();
  });
  scheduleAlignedStart(s);
  startTicker();render();
}

function blankLive(){return{laps:0,bestLapMs:Infinity,lastLapMs:null,lastPassPerf:null,lastDeviceMs:null,lastElapsedAtPass:null,elapsedMs:0,finished:false,finishedAt:null,status:'READY',startSeen:false,startSeenAtMs:null};}

function processPass(transponder,deviceMs=null,source='MANUAL'){
  lapwiz.lastId=String(transponder);
  const ev=currentEvent(state.race),s=state.session;
  if(!ev||!s||!['warmup','countdown','running','finishing'].includes(s.phase))return;
  const p=getEventPilots(state.race,ev).find(x=>String(x.transponder)===String(transponder));
  if(!p){
    s.unknown[transponder]=(s.unknown[transponder]||0)+1;
    if(source==='LAPWIZ')lapwiz.unknownBeep();
    toast(`Неизвестный ID ${transponder}`);return;
  }
  if(source==='LAPWIZ'&&state.settings.lapSound)announcer.playBleep();

  if(['warmup','countdown'].includes(s.phase)){
    const hit=s.warmupDetected[p.id]||{count:0,lastDeviceMs:null};
    hit.count++;hit.lastDeviceMs=Number.isFinite(deviceMs)?deviceMs:hit.lastDeviceMs;hit.lastAt=Date.now();
    s.warmupDetected[p.id]=hit;
    s.lastPass=`${p.name} · транспондер ✓ · проходов ${hit.count}`;
    updateDynamicCockpit();return;
  }
  processPilotPass(p,deviceMs,source);
}

function processPilotPass(p,deviceMs=null,source='MANUAL'){
  const ev=currentEvent(state.race),s=state.session;
  if(!ev||!s||!['running','finishing'].includes(s.phase))return;
  const l=s.live[p.id]||blankLive();if(l.finished)return;
  const now=performance.now(),elapsedNow=sessionElapsed(s);

  if(!l.startSeen){
    l.startSeen=true;l.startSeenAtMs=elapsedNow;l.lastPassPerf=now;l.lastElapsedAtPass=elapsedNow;
    if(Number.isFinite(deviceMs))l.lastDeviceMs=deviceMs;
    l.elapsedMs=elapsedNow;l.status='STARTED';s.live[p.id]=l;
    s.lastPass=`${p.name} · СТАРТ ✓`;
    updateDynamicCockpit();return;
  }

  let lapMs=null;
  if(l.laps===0){
    lapMs=elapsedNow;
  }else if(Number.isFinite(deviceMs)&&source==='LAPWIZ'&&Number.isFinite(l.lastDeviceMs)&&deviceMs>l.lastDeviceMs){
    lapMs=deviceMs-l.lastDeviceMs;
  }
  if(!Number.isFinite(lapMs)||lapMs<=0)lapMs=elapsedNow-(Number.isFinite(l.lastElapsedAtPass)?l.lastElapsedAtPass:0);
  if(Number.isFinite(deviceMs))l.lastDeviceMs=deviceMs;
  l.lastElapsedAtPass=elapsedNow;l.lastPassPerf=now;l.lastLapMs=lapMs;l.bestLapMs=Math.min(l.bestLapMs,lapMs);l.laps++;l.elapsedMs=elapsedNow;l.status='RACING';

  const rule=eventRule(state.race,ev);
  if(rule.limitType==='laps'&&l.laps>=rule.targetLaps){l.finished=true;l.finishedAt=l.elapsedMs;}
  if(s.phase==='finishing'&&s.timeExpired){l.finished=true;l.finishedAt=l.elapsedMs;}
  s.live[p.id]=l;s.lastPass=`${p.name} · ${l.laps} · ${fmtMs(lapMs)}`;
  updateDynamicCockpit();
  if(Object.values(s.live).every(v=>v.finished)&&(rule.limitType==='laps'||s.phase==='finishing'))finishSession('Все пилоты завершили заезд');
}

function timerProgress(s,ev){

function trackPitTimeoutMs(td=state.trackDay){const sec=Number(td?.pitTimeoutSec||0);return sec>0?sec*1000:0;}
function trackMinLapSec(td=state.trackDay){return Math.max(1,Math.min(60,Number(td?.minLapSec||state.settings.minLapSec||2)));}
function trackMinLapMs(td=state.trackDay){return trackMinLapSec(td)*1000;}
function trackPitTimeoutLabel(td=state.trackDay){const sec=Number(td?.pitTimeoutSec||0);if(sec<=0)return'Выкл.';if(sec%60===0)return`${sec/60} мин`;return`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;}
function trackPitTotalMs(l,td=state.trackDay){let total=Math.max(0,Number(l?.totalPitMs||0));if(l?.status==='PIT'&&Number.isFinite(l.pitStartedAtElapsedMs))total+=Math.max(0,trackElapsed(td)-l.pitStartedAtElapsedMs);return total;}
function trackLiveDisplay(l){if(!l?.startSeen)return{text:'ОЖИДАЕМ',cls:''};if(l.status==='PIT')return{text:'PIT',cls:'pit'};if(l.status==='PIT_OUT'&&Date.now()<Number(l.pitOutUntilEpoch||0))return{text:'PIT OUT',cls:'pitout'};if((l.laps||0)===0)return{text:'ЗАСЕЧКА ✓',cls:'ok'};return{text:'НА ТРАССЕ',cls:'ok'};}
function enterTrackPit(td,p,l,elapsedNow){const timeout=trackPitTimeoutMs(td);if(!timeout||!l.startSeen||l.status==='PIT'||!Number.isFinite(l.lastElapsedAtPass))return false;const threshold=l.lastElapsedAtPass+timeout;if(elapsedNow<threshold)return false;l.status='PIT';l.pitCount=Math.max(0,Number(l.pitCount||0))+1;l.pitStartedAtElapsedMs=threshold;l.pitOutAtElapsedMs=null;l.pitOutUntilEpoch=0;l.lastDeviceMs=null;l.pitEvents=Array.isArray(l.pitEvents)?l.pitEvents:[];l.pitEvents.push({inAtMs:threshold,outAtMs:null,durationMs:null});td.live[p.id]=l;td.lastPass=`${p.name} · PIT · незавершённый круг сброшен`;return true;}
function exitTrackPit(td,p,l,elapsedNow,deviceMs){const start=Number.isFinite(l.pitStartedAtElapsedMs)?l.pitStartedAtElapsedMs:elapsedNow;const duration=Math.max(0,elapsedNow-start);l.totalPitMs=Math.max(0,Number(l.totalPitMs||0))+duration;l.lastPitDurationMs=duration;l.pitStartedAtElapsedMs=null;l.pitOutAtElapsedMs=elapsedNow;l.pitOutUntilEpoch=Date.now()+8000;l.status='PIT_OUT';l.lastElapsedAtPass=elapsedNow;l.lastDeviceMs=Number.isFinite(deviceMs)?deviceMs:null;const events=Array.isArray(l.pitEvents)?l.pitEvents:[];const open=[...events].reverse().find(e=>e&&e.outAtMs==null);if(open){open.outAtMs=elapsedNow;open.durationMs=duration;}td.live[p.id]=l;td.lastPass=`${p.name} · PIT OUT`;return true;}
function updateTrackPitStates(td=state.trackDay){if(!td||td.status!=='active'||trackPitTimeoutMs(td)<=0)return false;const elapsed=trackElapsed(td);let changed=false;(td.pilots||[]).forEach(p=>{const l=td.live?.[p.id]||blankTrackLive();if(enterTrackPit(td,p,l,elapsed))changed=true;});if(changed)persistTrackDays();return changed;}
function finalizeOpenTrackPits(td,elapsedNow){(td?.pilots||[]).forEach(p=>{const l=td.live?.[p.id];if(!l||l.status!=='PIT'||!Number.isFinite(l.pitStartedAtElapsedMs))return;const duration=Math.max(0,elapsedNow-l.pitStartedAtElapsedMs);l.totalPitMs=Math.max(0,Number(l.totalPitMs||0))+duration;l.lastPitDurationMs=duration;const open=[...(l.pitEvents||[])].reverse().find(e=>e&&e.outAtMs==null);if(open){open.outAtMs=elapsedNow;open.durationMs=duration;}l.pitStartedAtElapsedMs=null;});}
function lapArray(live){return Array.isArray(live?.lapTimes)?live.lapTimes.filter(Number.isFinite):[];}
function lapSummary(live){const a=lapArray(live);if(!a.length)return{count:0,best:null,avg:null,worst:null,avgIndex:-1};const best=Math.min(...a),worst=Math.max(...a),avg=a.reduce((s,v)=>s+v,0)/a.length;let avgIndex=0,dist=Infinity;a.forEach((v,i)=>{const d=Math.abs(v-avg);if(d<dist){dist=d;avgIndex=i;}});return{count:a.length,best,avg,worst,avgIndex};}
function rankTrackPilots(td=state.trackDay){
  ensureTrackDayState(td);const pilots=(td?.pilots||[]).map(p=>({...p}));
  return pilots.sort((a,b)=>{const A=td.live?.[a.id]||blankTrackLive(),B=td.live?.[b.id]||blankTrackLive();if(B.laps!==A.laps)return B.laps-A.laps;const ab=Number.isFinite(A.bestLapMs)?A.bestLapMs:Infinity,bb=Number.isFinite(B.bestLapMs)?B.bestLapMs:Infinity;if(ab!==bb)return ab-bb;return String(a.name).localeCompare(String(b.name),'ru');});
}
function trackBest(td=state.trackDay){ensureTrackDayState(td);let out=null;(td?.pilots||[]).forEach(p=>{const l=td.live?.[p.id],ms=lapSummary(l||{}).best;if(Number.isFinite(ms)&&(!out||ms<out.ms))out={pilot:p,ms};});return out;}

function startTrackTicker(){if(state.trackTick)clearInterval(state.trackTick);state.trackTick=setInterval(()=>{updateTrackPitStates();updateTrackDayDynamic();if(state.trackDay?.status==='active'&&trackRemaining(state.trackDay)<=0&&!state.trackEnding)finishTrackDay('Время сессии истекло');},250);updateTrackPitStates();updateTrackDayDynamic();}
function updateTrackDayDynamic(){const td=state.trackDay;if(!td)return;const elapsed=trackElapsed(td),remaining=trackRemaining(td),total=Math.max(1,Number(td.durationMin||1)*60000),progress=Math.max(0,Math.min(100,remaining/total*100));const q=(id,text)=>{const el=$(id);if(el)el.textContent=text;};q('#trackElapsed',fmtClock(elapsed));q('#trackRemaining',fmtClock(remaining));q('#trackMainTimer',td.status==='active'?fmtClock(remaining):fmtClock(td.elapsedFinalMs||elapsed));q('#trackClock',new Date().toLocaleTimeString('ru-RU',{hour12:false}));const ring=$('#trackTimerRing');if(ring){ring.style.setProperty('--progress',progress);const s=ring.querySelector('span');if(s)s.textContent=`${Math.round(progress)}%`;}const best=trackBest(td);q('#trackBestHero',best?`${best.pilot.name} · ${fmtMs(best.ms)}`:'—');q('#trackLastPass',td.lastPass||'—');q('#trackLapTotal',String(Object.values(td.live||{}).reduce((s,l)=>s+Number(l.laps||0),0)));const board=$('#trackPilotBoard');if(board){const sig=rankTrackPilots(td).map(p=>{const l=td.live?.[p.id]||blankTrackLive();const ds=trackLiveDisplay(l);return`${p.id}:${l.laps}:${Math.round(l.lastLapMs||0)}:${Math.round(l.bestLapMs||0)}:${l.startSeen}:${l.status}:${ds.text}:${l.pitCount||0}`;}).join('|');if(sig!==td._boardSig){td._boardSig=sig;board.innerHTML=trackDayPilotRows(td);bind415PilotStats();}}}

async function startTrackDay(){
 if(state.session&&['warmup','countdown','running','finishing','paused'].includes(state.session.phase))return toast('Сначала завершите текущий RallyCross-заезд');
 const td=state.trackDay||newTrackDayDraft(),chosen=$$('[data-track-pilot]:checked').map(x=>x.dataset.trackPilot);if(chosen.length<1)return toast('Выберите хотя бы одного пилота');
 td.name=$('#trackName')?.value.trim()||'Track Day';td.date=$('#trackDate')?.value||new Date().toISOString().slice(0,10);td.durationMin=Number($('#trackDuration')?.value)||30;td.pitTimeoutSec=Math.max(0,Number($('#trackPitTimeout')?.value??td.pitTimeoutSec??120));td.minLapSec=Math.max(1,Math.min(60,Number($('#trackMinLapSec')?.value??td.minLapSec??state.settings.minLapSec??2)));td.pilotIds=chosen;td.pilots=chosen.map((id,i)=>{const p=state.pilotDb.find(x=>x.id===id);return p?{id:p.id,name:p.name,club:p.club||'',city:p.city||'',transponder:String(p.transponder||''),registrationOrder:i+1}:null;}).filter(Boolean);
 if(!td.pilots.length)return toast('Не удалось сформировать участников');
 if(!await ensureRaceAudioFromGesture())return;
 try{if(lapwiz.connected){if(lapwiz.running)await lapwiz.stop();await lapwiz.start({mode:'practice',limitType:'time',durationMin:960,targetLaps:0,minLapSec:trackMinLapSec(td)});}}catch(e){toast(`LapWiz: ${e.message}`);return;}
 td.status='active';td.startedAtEpoch=Date.now();td.finishedAtEpoch=null;td.elapsedFinalMs=null;td.live=Object.fromEntries(td.pilots.map(p=>[p.id,blankTrackLive()]));td.unknown={};td.lastPass='Сессия запущена · ожидаем транспондеры';state.trackDay=td;persistTrackDays();nav('trackDayCockpit');
}
async function finishTrackDay(reason='Сессия завершена'){
 const td=state.trackDay;if(!td||td.status!=='active'||state.trackEnding)return;state.trackEnding=true;
 try{td.elapsedFinalMs=trackElapsed(td);finalizeOpenTrackPits(td,td.elapsedFinalMs);td.status='finished';td.finishedAtEpoch=Date.now();td.note=reason;if(lapwiz.connected&&lapwiz.running&&lapwiz.currentMode==='practice'){try{await lapwiz.stop();}catch(e){toast(`LapWiz STOP: ${e.message}`);}}const clean=deepClone(td);delete clean._boardSig;const idx=state.trackDays.findIndex(x=>x.id===td.id);if(idx>=0)state.trackDays[idx]=clean;else state.trackDays.push(clean);persistTrackDays();toast(reason);render();}finally{state.trackEnding=false;}
}
function processTrackPass(transponder,deviceMs=null,source='MANUAL'){
 const td=ensureTrackDayState(state.trackDay);if(!td||td.status!=='active')return;const p=(td.pilots||[]).find(x=>String(x.transponder)===String(transponder));
 if(!p){td.unknown[transponder]=(td.unknown[transponder]||0)+1;if(source==='LAPWIZ')lapwiz.unknownBeep();td.lastPass=`Неизвестный ID ${transponder}`;persistTrackDays();updateTrackDayDynamic();return;}
 const l=td.live[p.id]||blankTrackLive(),elapsed=trackElapsed(td);
 const acceptedBleep=()=>{if(source==='LAPWIZ'&&state.settings.lapSound)announcer.playBleep();};
 if(!l.startSeen){l.startSeen=true;l.startSeenAtMs=elapsed;l.lastElapsedAtPass=elapsed;l.lastDeviceMs=Number.isFinite(deviceMs)?deviceMs:null;l.status='SEEN';td.live[p.id]=l;td.lastPass=`${p.name} · ЗАСЕЧКА ✓`;acceptedBleep();persistTrackDays();updateTrackDayDynamic();return;}
 // Safety: check PIT timeout here too, so a late pass can never become a giant lap between UI ticker updates.
 if(l.status!=='PIT')enterTrackPit(td,p,l,elapsed);
 if(l.status==='PIT'){exitTrackPit(td,p,l,elapsed,deviceMs);acceptedBleep();persistTrackDays();updateTrackDayDynamic();return;}
 let lapMs=null;if(Number.isFinite(deviceMs)&&Number.isFinite(l.lastDeviceMs)&&deviceMs>l.lastDeviceMs)lapMs=deviceMs-l.lastDeviceMs;if(!Number.isFinite(lapMs)||lapMs<=0)lapMs=elapsed-(Number.isFinite(l.lastElapsedAtPass)?l.lastElapsedAtPass:elapsed);
 const minLapMs=trackMinLapMs(td);if(Number.isFinite(lapMs)&&lapMs>0&&lapMs<minLapMs){td.lastPass=`${p.name} · ${fmtMs(lapMs)} < ${trackMinLapSec(td)}с · проход отклонён`;persistTrackDays();updateTrackDayDynamic();return;}
 if(Number.isFinite(deviceMs))l.lastDeviceMs=deviceMs;l.lastElapsedAtPass=elapsed;l.lastLapMs=lapMs;l.lapTimes=lapArray(l);l.lapTimes.push(lapMs);l.laps=l.lapTimes.length;l.bestLapMs=Math.min(l.bestLapMs,lapMs);l.status='RACING';l.pitOutUntilEpoch=0;td.live[p.id]=l;td.lastPass=`${p.name} · круг ${l.laps} · ${fmtMs(lapMs)}`;acceptedBleep();persistTrackDays();updateTrackDayDynamic();
}

function blankLive(){return{laps:0,bestLapMs:Infinity,lastLapMs:null,lastPassPerf:null,lastDeviceMs:null,lastElapsedAtPass:null,elapsedMs:0,finished:false,finishedAt:null,status:'READY',startSeen:false,startSeenAtMs:null,lapTimes:[]};}
function ensureSession(ev){
  if(!ev)return null;
  if(state.session?.eventKey!==ev.key){state.session={eventKey:ev.key,phase:'ready',startedAtPerf:null,startedAtEpoch:null,finishedAtEpoch:null,elapsedBeforePause:0,elapsedFinalMs:null,extraMs:0,resumePhase:'running',countdownLeft:state.race.raceSettings.countdownSec,warmupTotalSec:raceWarmupMinutes()*60,warmupEndsAtPerf:null,warmupDetected:{},live:Object.fromEntries(getEventPilots(state.race,ev).map(p=>[p.id,blankLive()])),unknown:{},lastPass:''};}
  state.session.warmupDetected=state.session.warmupDetected||{};Object.keys(state.session.live||{}).forEach(id=>{const l=state.session.live[id];if(l.startSeen===undefined)l.startSeen=false;if(!Array.isArray(l.lapTimes))l.lapTimes=[];});return state.session;
}
function processPass(transponder,deviceMs=null,source='MANUAL'){
  lapwiz.lastId=String(transponder);
  if(state.trackDay?.status==='active')return processTrackPass(transponder,deviceMs,source);
  const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['warmup','countdown','running','finishing'].includes(s.phase))return;const p=getEventPilots(state.race,ev).find(x=>String(x.transponder)===String(transponder));
  if(!p){s.unknown[transponder]=(s.unknown[transponder]||0)+1;if(source==='LAPWIZ')lapwiz.unknownBeep();toast(`Неизвестный ID ${transponder}`);return;}
  if(source==='LAPWIZ'&&state.settings.lapSound)announcer.playBleep();
  if(['warmup','countdown'].includes(s.phase)){const hit=s.warmupDetected[p.id]||{count:0,lastDeviceMs:null};hit.count++;hit.lastDeviceMs=Number.isFinite(deviceMs)?deviceMs:hit.lastDeviceMs;hit.lastAt=Date.now();s.warmupDetected[p.id]=hit;s.lastPass=`${p.name} · транспондер ✓ · проходов ${hit.count}`;updateDynamicCockpit();return;}
  processPilotPass(p,deviceMs,source);
}
function processPilotPass(p,deviceMs=null,source='MANUAL'){
  const ev=currentEvent(state.race),s=state.session;if(!ev||!s||!['running','finishing'].includes(s.phase))return;const l=s.live[p.id]||blankLive();if(l.finished)return;const now=performance.now(),elapsedNow=sessionElapsed(s);if(!Array.isArray(l.lapTimes))l.lapTimes=[];
  if(!l.startSeen){l.startSeen=true;l.startSeenAtMs=elapsedNow;l.lastPassPerf=now;l.lastElapsedAtPass=elapsedNow;if(Number.isFinite(deviceMs))l.lastDeviceMs=deviceMs;l.elapsedMs=elapsedNow;l.status='STARTED';s.live[p.id]=l;s.lastPass=`${p.name} · СТАРТ ✓`;updateDynamicCockpit();return;}
  let lapMs=null;if(l.laps===0)lapMs=elapsedNow;else if(Number.isFinite(deviceMs)&&source==='LAPWIZ'&&Number.isFinite(l.lastDeviceMs)&&deviceMs>l.lastDeviceMs)lapMs=deviceMs-l.lastDeviceMs;if(!Number.isFinite(lapMs)||lapMs<=0)lapMs=elapsedNow-(Number.isFinite(l.lastElapsedAtPass)?l.lastElapsedAtPass:0);if(Number.isFinite(deviceMs))l.lastDeviceMs=deviceMs;l.lastElapsedAtPass=elapsedNow;l.lastPassPerf=now;l.lastLapMs=lapMs;l.lapTimes.push(lapMs);l.laps=l.lapTimes.length;l.bestLapMs=Math.min(l.bestLapMs,lapMs);l.elapsedMs=elapsedNow;l.status='RACING';const rule=eventRule(state.race,ev);if(rule.limitType==='laps'&&l.laps>=rule.targetLaps){l.finished=true;l.finishedAt=l.elapsedMs;}if(s.phase==='finishing'&&s.timeExpired){l.finished=true;l.finishedAt=l.elapsedMs;}s.live[p.id]=l;s.lastPass=`${p.name} · ${l.laps} · ${fmtMs(lapMs)}`;updateDynamicCockpit();if(Object.values(s.live).every(v=>v.finished)&&(rule.limitType==='laps'||s.phase==='finishing'))finishSession('Все пилоты завершили заезд');
}
function snapshotRaceLapStats(ev){if(!ev||!state.session)return;ev.lapStats={};getEventPilots(state.race,ev).forEach(p=>{const l=state.session.live?.[p.id]||blankLive();ev.lapStats[p.id]={laps:l.laps||0,bestLapMs:Number.isFinite(l.bestLapMs)?l.bestLapMs:null,lastLapMs:l.lastLapMs,lapTimes:[...lapArray(l)],startSeen:Boolean(l.startSeen),elapsedMs:l.elapsedMs||0};});}
function saveCurrentEventResult(){const race=state.race,ev=currentEvent(race),s=state.session;if(!ev||s?.phase!=='finished')return toast('Сначала завершите заезд');try{snapshotRaceLapStats(findRawEvent(ev.key));const result=readEditedResult();if(ev.type==='qualifying')saveQualifyingEvent(race,ev.key,result);else saveFinalEvent(race,ev.key,result);syncChampionshipIfFinished(race);persistRace();state.session=null;state.resultsOpen=false;toast('Результат сохранён. Следующий заезд подготовлен.');render();}catch(e){toast(e.message);}}

function pilotTable(pilots,session){

  return `<div class="pilotRow header"><span>POS</span><span>ПИЛОТ</span><span>КРУГИ</span><span>ЛУЧШИЙ КРУГ</span><span>ПОСЛЕДНИЙ</span><span>ОТСТАВАНИЕ</span><span>СТАТУС</span></div>${pilots.map((p,i)=>{const l=session?.live?.[p.id]||blankLive(),gap=pre?'—':gapText(pilots,session,p,i);let status='Готов';if(pre)status=session?.warmupDetected?.[p.id]?'НА ТРАССЕ ✓':'ОЖИДАЕТСЯ';else if(l.finished)status='Финиш';else if(['running','finishing'].includes(session?.phase)&&!l.startSeen)status='ОЖИДАЕМ ЗАСЕЧКУ';else if(['running','finishing'].includes(session?.phase)&&l.startSeen&&l.laps===0)status='СТАРТ ✓';else if(i===0&&l.laps>0)status='Лидер';else if(['running','finishing'].includes(session?.phase))status='В гонке';else if(session?.phase==='paused')status='Пауза';const key=String(p.id).replace(/[^a-zA-Z0-9_-]/g,'_');return `<div class="pilotRow clickablePilot ${i===0&&l.laps>0?'leader':''} ${l.finished?'finished':''}" data-pilot-stats="${p.id}" data-stats-context="race" style="view-transition-name:pilot_${key}"><div class="pos">${i+1}</div><div><div class="name">${esc(p.name)}</div><div class="sub">ID ${esc(p.transponder||'—')} · нажмите для кругов</div></div><b class="lapsCell">${l.laps}</b><span class="bestCell">${fmtMs(l.bestLapMs)}</span><span>${fmtMs(l.lastLapMs)}</span><span>${gap}</span><span class="pilotStatus ${session?.warmupDetected?.[p.id]?'leaderStatus':''}"><i></i>${status}</span></div>`;}).join('')}`;

function findRawEvent(key){return state.race?.heats?.find(x=>x.key===key)||state.race?.finals?.find(x=>x.key===key)||null;}
function finalizeQualifyingIfNeeded(race){updateStandings(race);normalizeQualifyingEnabled(race);if(race.heats.every(h=>h.saved)){const ties=getExactTieGroups(race).filter(g=>g.some(p=>!Number.isInteger(race.exactTieLots?.[String(p.id)])));if(ties.length)race.stage='tie';else generateFinals(race);}}
function cancelRawEvent(raw){if(!raw||raw.saved)return;raw.saved=true;raw.cancelled=true;raw.cancelledAt=new Date().toISOString();raw.result=[];raw.enabled=false;if(raw.type==='qualifying')finalizeQualifyingIfNeeded(state.race);else{try{advanceFinalists(state.race,raw);}catch(e){console.warn('cancel advance',e);}}}
async function stopActiveRaceForManagement(){announcer.cancel();clearPrestartTimers?.();if(state.session&&['warmup','countdown','running','finishing','paused'].includes(state.session.phase)){if(lapwiz.connected&&lapwiz.running){try{await lapwiz.stop();}catch(e){console.warn(e);}}}state.session=null;}
async function skipRaceEvents(count=1){if(!state.race)return;await stopActiveRaceForManagement();let skipped=0;for(let i=0;i<count;i++){const ev=currentEvent(state.race);if(!ev)break;const raw=findRawEvent(ev.key);if(!raw)break;cancelRawEvent(raw);skipped++;}persistRace();toast(`Отменено заездов: ${skipped}`);closeModal();render();}
async function cancelCurrentQualRound(){const ev=currentEvent(state.race);if(!ev||ev.type!=='qualifying')return toast('Сейчас не квалификационный заезд');if(!confirm(`Отменить всю квалификационную серию Q${ev.round}? Результаты этой серии не будут учитываться.`))return;await stopActiveRaceForManagement();state.race.heats.filter(h=>h.round===ev.round&&!h.saved).forEach(cancelRawEvent);finalizeQualifyingIfNeeded(state.race);persistRace();closeModal();render();}
async function finishQualificationNow(){const ev=currentEvent(state.race);if(!ev||state.race.stage!=='qualifying')return toast('Квалификация уже завершена');if(!confirm('Отменить все оставшиеся квалификационные заезды и перейти к финальной части по уже полученным результатам?'))return;await stopActiveRaceForManagement();state.race.heats.filter(h=>!h.saved).forEach(h=>{h.saved=true;h.cancelled=true;h.result=[];h.enabled=false;});updateStandings(state.race);const ties=getExactTieGroups(state.race).filter(g=>g.some(p=>!Number.isInteger(state.race.exactTieLots?.[String(p.id)])));if(ties.length)state.race.stage='tie';else generateFinals(state.race);persistRace();closeModal();render();}
async function forceFinishCompetition(){if(!state.race)return;if(!confirm('Завершить спортивную часть соревнования сейчас? Все оставшиеся заезды будут отмечены как отменённые.'))return;await stopActiveRaceForManagement();let guard=0;while(currentEvent(state.race)&&guard++<80){cancelRawEvent(findRawEvent(currentEvent(state.race).key));}if(state.race.stage==='tie'||state.race.stage!=='finished'){updateStandings(state.race);state.race.finalProtocol=state.race.pilots.map((p,i)=>({place:i+1,pilotId:p.id,status:'FIN',source:'Досрочное завершение',eventPoints:EVENT_POINTS[i]||0}));state.race.stage='finished';state.race.lifecycleStatus='completed';state.race.completedAt=new Date().toISOString();}persistRace();closeModal();toast('Соревнование завершено досрочно');render();}
async function quickSkipCurrentRace(){
  const ev=currentEvent(state.race);
  if(!ev)return toast('Нет активного заезда');
  if(!confirm(`Пропустить «${ev.label}»? Заезд будет отмечен как отменённый, результат не сохранится, приложение перейдёт к следующему.`))return;

  slot('ctl-finish','',`disabled`,'pause','ПАУЗА'),
  slot('ctl-plus','',`disabled`,'plusClock','+1 МИН'),
  slot('ctl-primary','primary',`data-action="tie-draw"`,'refresh','ЖЕРЕБЬЁВКА'),
  slot('ctl-manual','',`disabled`,'refresh','РУЧНОЙ КРУГ'),
  slot('ctl-stop','danger',`data-action="home"`,'stop','ВЫХОД'),
  slot('ctl-skip','',`disabled`,'next','ПРОПУСТИТЬ ЗАЕЗД')
 ].join('');
 if(done)return [
  slot('ctl-pause','',`data-action="home"`,'home','ГЛАВНАЯ'),
  slot('ctl-finish','',`data-action="open-rx"`,'settings','НАСТРОЙКА'),
  slot('ctl-plus','primary',`data-action="race-results"`,'chart','РЕЗУЛЬТАТЫ'),
  slot('ctl-primary','',`disabled`,'mic','ДИКТОР'),
  slot('ctl-manual','',`disabled`,'radio','BROADCAST'),
  slot('ctl-stop','danger',`data-action="complete-competition"`,'stop','ЗАВЕРШИТЬ'),
  slot('ctl-skip','',`disabled`,'next','ПРОПУСТИТЬ ЗАЕЗД')
 ].join('');
 const p=s?.phase||'ready',timeRule=eventRule(state.race,currentEvent(state.race))?.limitType==='time';
 const primary=p==='ready'
   ?slot('ctl-primary','primary',`data-action="start-session"`,'play','СТАРТ / ПРОГРЕВ')
   :p==='finished'
     ?slot('ctl-primary','primary',`data-action="next-event"`,'next','СЛЕДУЮЩИЙ')
     :slot('ctl-primary','primary',`disabled`,'next','СЛЕДУЮЩИЙ');
 return [
  slot('ctl-pause','',`data-action="pause-session" ${!['running','finishing','paused'].includes(p)?'disabled':''}`,p==='paused'?'play':'pause',p==='paused'?'ПРОДОЛЖИТЬ':'ПАУЗА'),
  slot('ctl-finish','',`data-action="finish-session" ${!['running','finishing','paused'].includes(p)?'disabled':''}`,'flag','ФИНИШ'),
  slot('ctl-plus','',`data-action="add-minute" ${!timeRule||!['running','paused','finishing'].includes(p)?'disabled':''}`,'plusClock','+1 МИН'),
  primary,
  slot('ctl-manual','primarySoft',`data-action="manual-lap-modal" ${!['running','finishing'].includes(p)?'disabled':''}`,'refresh','РУЧНОЙ КРУГ'),
  slot('ctl-stop','danger',`data-action="stop-session" ${!['warmup','countdown','running','finishing','paused'].includes(p)?'disabled':''}`,'stop','СТОП'),
  slot('ctl-skip','',`data-race-skip-current="1"`,'next','ПРОПУСТИТЬ ЗАЕЗД')
 ].join('');
}
